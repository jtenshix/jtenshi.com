<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espejo de Transmisión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .layout {
            flex: 1;
            width: 100%;
            margin: 0;
            padding: 12px;
            display: flex;
            min-height: 0;
        }

        .stream-layout {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(300px, 1fr) minmax(0, 2.2fr) minmax(300px, 1fr);
            gap: 12px;
            align-items: stretch;
            height: 100%;
        }

        .sidebar-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;
            overflow-y: auto;
        }

        .recommended-section {
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .streamer-widget-content {
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
        }

        .streamer-widget {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 15;
            background: #0e0e10;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        #twitchPlayer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #twitchPlayer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .donation-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 8px;
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .donation-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 2px;
            background: #1f1f23;
            border: 1px solid #3a3a3d;
            border-radius: 5px;
            color: #efeff1;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }

        .donation-btn i {
            font-size: 16px;
        }

        .donation-btn:hover {
            background: #2d2d30;
            border-color: #9147ff;
        }

        .center-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;
        }

        .video-area {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #303033;
            min-height: 0;
        }

        #secondScreen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #secondScreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #secondScreen video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 14px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .chat-area {
            width: 100%;
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .chat-header {
            height: 38px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px solid #303033;
        }

        .chat-frame {
            flex: 1;
            min-height: 0;
        }

        .chat-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #twitchPlayerOverlay {
            display: none;
        }

        /* DISEÑO MÓVIL: Mitad superior videos unidos, mitad inferior chat entero */
        @media (max-width: 1024px) {
            html, body {
                height: 100%;
                overflow: hidden;
            }

            .layout {
                padding: 4px;
                height: 100%;
            }

            .stream-layout {
                position: relative;
                display: flex;
                flex-direction: column;
                height: 100%;
                width: 100%;
                gap: 4px;
            }

            .sidebar-left {
                display: none;
            }

            /* Mitad superior: Video principal con Twitch superpuesto estilo camarita */
            .center-area {
                position: relative;
                flex: 1;
                width: 100%;
                height: auto;
                min-height: 0;
            }

            .video-area {
                width: 100%;
                height: 100%;
                border-radius: 6px;
            }

            #twitchPlayerOverlay {
                display: block;
                position: absolute;
                top: 8px;
                left: 8px;
                width: 120px;
                height: 70px;
                z-index: 20;
                background: #0e0e10;
                border-radius: 4px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                box-shadow: 0 4px 10px rgba(0,0,0,0.8);
                overflow: hidden;
            }

            #twitchPlayerOverlay iframe {
                width: 100%;
                height: 100%;
                border: none;
                display: block;
            }

            /* Mitad inferior: El chat ocupa toda la mitad de abajo limpia y cómoda para escribir */
            .chat-area {
                position: relative;
                flex: 1;
                width: 100%;
                height: auto;
                min-height: 0;
                border-radius: 6px;
            }

            .chat-header {
                height: 30px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="layout">
        <div class="stream-layout">
            <aside class="sidebar-left">
                <div class="recommended-section">
                    <div class="streamer-widget-content">
                        <div class="streamer-widget">
                            <div id="twitchPlayer">
                                <div class="empty-message" style="background:#0e0e10;">Sin canal</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="donation-links">
                    <a href="https://ko-fi.com/cotecreator/shop" target="_blank" class="donation-btn" title="Ko-fi">
                        <i class="fa-solid fa-mug-hot" style="color: #29abe0;"></i>
                        Ko-fi
                    </a>
                    <a href="https://ceneka.net/coteparrague" target="_blank" class="donation-btn" title="Ceneka">
                        <i class="fa-solid fa-heart" style="color: #ff4757;"></i>
                        Ceneka
                    </a>
                    <a href="https://streamelements.com/coteparrague/tip" target="_blank" class="donation-btn" title="Tips">
                        <i class="fa-solid fa-hand-holding-dollar" style="color: #2ed573;"></i>
                        Tips
                    </a>
                </div>
            </aside>

            <section class="center-area">
                <div class="video-area">
                    <div id="secondScreen">
                        <div class="empty-message">Esperando transmisión...</div>
                    </div>
                    <div id="twitchPlayerOverlay">
                        <div id="twitchOverlayContent" style="width:100%; height:100%;"></div>
                    </div>
                </div>
            </section>

            <aside class="chat-area">
                <div class="chat-header">
                    Chat del stream
                </div>
                <div class="chat-frame">
                    <iframe id="twitchChat" title="Chat del stream"></iframe>
                </div>
            </aside>
        </div>
    </main>

    <script>
        function obtenerPlataforma(url) {
            url = (url || "").trim();
            if (!url) return { tipo: null, canal: null };
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }
            try {
                const direccion = new URL(url);
                const host = direccion.hostname.toLowerCase();
                const partes = direccion.pathname.replace(/^\/+/, "").replace(/\/+$/, "").split("/");

                if (host.includes("twitch.tv")) {
                    return { tipo: "twitch", canal: partes[0] || null };
                }
                if (host.includes("kick.com")) {
                    return { tipo: "kick", canal: partes[0] || null };
                }
            } catch (error) {
                return { tipo: null, canal: null };
            }
            return { tipo: null, canal: null };
        }

        function obtenerYoutubeId(url) {
            try {
                const direccion = new URL(url);
                const hostname = direccion.hostname.toLowerCase();
                if (hostname.includes("youtube.com")) {
                    const id = direccion.searchParams.get("v");
                    if (id) return id;
                }
                if (hostname === "youtu.be") {
                    return direccion.pathname.replace(/^\/+/, "").split("/")[0];
                }
                if (direccion.pathname.startsWith("/live/") || direccion.pathname.startsWith("/shorts/")) {
                    return direccion.pathname.split("/")[2];
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        function convertirGoogleDrive(url) {
            try {
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    const fileId = match[1];
                    return `https://drive.google.com/file/d/${fileId}/preview`;
                }
            } catch (e) {
                console.error("Error procesando link de Drive", e);
            }
            return null;
        }

        function cargarStreamerPrincipal(urlVal) {
            const { tipo, canal } = obtenerPlataforma(urlVal);
            const parent = window.location.hostname || "localhost";
            const playerDiv = document.getElementById("twitchPlayer");
            const overlayContent = document.getElementById("twitchOverlayContent");
            const chat = document.getElementById("twitchChat");
            
            playerDiv.innerHTML = "";
            overlayContent.innerHTML = "";

            if (!tipo || !canal) {
                playerDiv.innerHTML = `<div class="empty-message" style="background:#0e0e10;">Sin canal</div>`;
                chat.src = "";
                return;
            }

            if (tipo === "twitch") {
                const iframeDesktop = document.createElement("iframe");
                iframeDesktop.src = `https://player.twitch.tv/?channel=${encodeURIComponent(canal)}&parent=${encodeURIComponent(parent)}&muted=true&autoplay=true`;
                iframeDesktop.allowFullscreen = true;
                iframeDesktop.allow = "autoplay; encrypted-media; fullscreen";
                playerDiv.appendChild(iframeDesktop);

                const iframeMobile = document.createElement("iframe");
                iframeMobile.src = `https://player.twitch.tv/?channel=${encodeURIComponent(canal)}&parent=${encodeURIComponent(parent)}&muted=true&autoplay=true`;
                iframeMobile.allowFullscreen = true;
                iframeMobile.allow = "autoplay; encrypted-media; fullscreen";
                overlayContent.appendChild(iframeMobile);

                chat.src = `https://www.twitch.tv/embed/${encodeURIComponent(canal)}/chat?parent=${encodeURIComponent(parent)}`;
            } else if (tipo === "kick") {
                const iframeDesktop = document.createElement("iframe");
                iframeDesktop.src = `https://player.kick.com/${encodeURIComponent(canal)}`;
                iframeDesktop.allowFullscreen = true;
                iframeDesktop.allow = "autoplay; encrypted-media; fullscreen";
                playerDiv.appendChild(iframeDesktop);

                const iframeMobile = document.createElement("iframe");
                iframeMobile.src = `https://player.kick.com/${encodeURIComponent(canal)}`;
                iframeMobile.allowFullscreen = true;
                iframeMobile.allow = "autoplay; encrypted-media; fullscreen";
                overlayContent.appendChild(iframeMobile);

                chat.src = `https://kick.com/${encodeURIComponent(canal)}/chatroom`;
            }
        }

        function cargarSegundoVideo(url) {
            const pantalla = document.getElementById("secondScreen");
            if (!url) {
                pantalla.innerHTML = `<div class="empty-message">Esperando transmisión...</div>`;
                return;
            }

            pantalla.innerHTML = "";

            if (url.toLowerCase().startsWith("<iframe")) {
                pantalla.innerHTML = url;
                const iframeElement = pantalla.querySelector("iframe");
                if (iframeElement) {
                    iframeElement.style.width = "100%";
                    iframeElement.style.height = "100%";
                    iframeElement.style.border = "none";
                }
                return;
            }

            const youtubeId = obtenerYoutubeId(url);
            if (youtubeId) {
                const iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(youtubeId) + "?autoplay=1";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;
                pantalla.appendChild(iframe);
                return;
            }

            const linkDrivePreview = convertirGoogleDrive(url);
            if (linkDrivePreview) {
                const iframe = document.createElement("iframe");
                iframe.src = linkDrivePreview;
                iframe.allow = "autoplay; fullscreen; picture-in-picture";
                iframe.allowFullscreen = true;
                pantalla.appendChild(iframe);
                return;
            }

            const { tipo, canal } = obtenerPlataforma(url);
            if (tipo === "kick") {
                const iframe = document.createElement("iframe");
                iframe.src = `https://player.kick.com/${encodeURIComponent(canal)}`;
                iframe.allow = "autoplay; fullscreen; picture-in-picture";
                iframe.allowFullscreen = true;
                pantalla.appendChild(iframe);
                return;
            }

            const urlSinQuery = url.split("?")[0].toLowerCase();
            const esVideoDirecto = urlSinQuery.endsWith(".mp4") || urlSinQuery.endsWith(".webm") || urlSinQuery.endsWith(".ogg") || urlSinQuery.endsWith(".mov");

            if (esVideoDirecto) {
                const video = document.createElement("video");
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                pantalla.appendChild(video);
                return;
            }

            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            pantalla.appendChild(iframe);
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            let twitchUrl = params.get("twitch") || "";
            let videoUrl = params.get("url") || "";

            cargarStreamerPrincipal(twitchUrl);
            cargarSegundoVideo(videoUrl);
        };
    </script>

</body>

</html>
