<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espejo - Transmisión General</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e10;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        .espejo-layout {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 0;
        }

        .espejo-main {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        .espejo-twitch-box {
            height: 40%;
            width: 100%;
            background: #0e0e10;
            border-bottom: 2px solid #303033;
            position: relative;
        }

        .espejo-video-box {
            flex: 1;
            width: 100%;
            background: #000;
            position: relative;
        }

        .espejo-chat-box {
            height: 100%;
            background: #18181b;
            border-left: 2px solid #303033;
            position: relative;
        }

        .espejo-twitch-box iframe,
        .espejo-video-box iframe,
        .espejo-video-box video,
        .espejo-chat-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <main class="espejo-layout">
        <section class="espejo-main">
            <div class="espejo-twitch-box" id="espejoTwitch">
                <div class="empty-message">Esperando canal de Twitch...</div>
            </div>
            <div class="espejo-video-box" id="espejoScreen">
                <div class="empty-message">Esperando video en curso...</div>
            </div>
        </section>

        <aside class="espejo-chat-box" id="espejoChat">
            <div class="empty-message">Esperando chat...</div>
        </aside>
    </main>

    <script>
        function obtenerCanal(url) {
            url = (url || "").trim();
            if (!url) return null;
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }
            try {
                const direccion = new URL(url);
                if (!direccion.hostname.toLowerCase().includes("twitch.tv")) return null;
                const partes = direccion.pathname.replace(/^\/+/, "").replace(/\/+$/, "").split("/");
                return partes[0] || null;
            } catch (error) {
                return null;
            }
        }

        function convertirGoogleDrive(url) {
            try {
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            } catch (e) {
                console.error("Error en Drive", e);
            }
            return null;
        }

        function obtenerYoutubeId(url) {
            try {
                const direccion = new URL(url);
                const hostname = direccion.hostname.toLowerCase();
                if (hostname.includes("youtube.com")) {
                    return direccion.searchParams.get("v");
                }
                if (hostname === "youtu.be") {
                    return direccion.pathname.replace(/^\/+/, "").split("/")[0];
                }
            } catch (error) {
                return null;
            }
            return null;
        }

        function actualizarTwitch(twitchUrl) {
            const canal = obtenerCanal(twitchUrl);
            const pantallaTwitch = document.getElementById("espejoTwitch");
            const pantallaChat = document.getElementById("espejoChat");
            
            // Usar el hostname actual o fallback seguro para Twitch embed
            let parent = window.location.hostname;
            if (!parent || parent === "") {
                parent = "localhost";
            }

            if (canal) {
                pantallaTwitch.innerHTML = `<iframe src="https://player.twitch.tv/?channel=${encodeURIComponent(canal)}&parent=${encodeURIComponent(parent)}&muted=true&autoplay=true" allowfullscreen></iframe>`;
                pantallaChat.innerHTML = `<iframe src="https://www.twitch.tv/embed/${encodeURIComponent(canal)}/chat?parent=${encodeURIComponent(parent)}"></iframe>`;
            }
        }

        function actualizarVideo(videoUrl) {
            const pantallaVideo = document.getElementById("espejoScreen");
            if (!videoUrl) return;

            pantallaVideo.innerHTML = "";

            if (videoUrl.toLowerCase().startsWith("<iframe")) {
                pantallaVideo.innerHTML = videoUrl;
                return;
            }

            const youtubeId = obtenerYoutubeId(videoUrl);
            if (youtubeId) {
                pantallaVideo.innerHTML = `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                return;
            }

            const linkDrive = convertirGoogleDrive(videoUrl);
            if (linkDrive) {
                pantallaVideo.innerHTML = `<iframe src="${linkDrive}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                return;
            }

            pantallaVideo.innerHTML = `<iframe src="${videoUrl}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
        }

        function cargarDatosEspejo() {
            // 1. Intentar leer de la URL primero
            const params = new URLSearchParams(window.location.search);
            let videoUrl = params.get("url");
            let twitchUrl = params.get("twitch");

            // 2. Si no están en la URL, rescatarlos del localStorage como respaldo sincronizado
            if (!videoUrl) videoUrl = localStorage.getItem("espejo_video");
            if (!twitchUrl) twitchUrl = localStorage.getItem("espejo_twitch");

            if (twitchUrl) actualizarTwitch(twitchUrl);
            if (videoUrl) actualizarVideo(videoUrl);
        }

        window.onload = function() {
            cargarDatosEspejo();
        };

        // Escuchar cambios en tiempo real si se actualiza desde el panel principal
        window.addEventListener("storage", function(event) {
            if (event.key === "espejo_video") {
                actualizarVideo(event.newValue);
            }
            if (event.key === "espejo_twitch") {
                actualizarTwitch(event.newValue);
            }
        });
    </script>

</body>
</html>
