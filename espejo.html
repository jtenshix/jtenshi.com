<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espejo - Transmisión</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e10;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .espejo-layout {
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
        }

        /* Pantalla principal del video (ocupa todo o se ajusta) */
        .espejo-video-area {
            flex: 1;
            height: 100%;
            position: relative;
            background: #000;
        }

        #espejoScreen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #espejoScreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #espejoScreen video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <main class="espejo-layout">
        <section class="espejo-video-area">
            <div id="espejoScreen">
                <div class="empty-message">Esperando contenido...</div>
            </div>
        </section>
    </main>

    <script>
        function convertirGoogleDrive(url) {
            try {
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    const fileId = match[1];
                    return `https://drive.google.com/file/d/${fileId}/preview`;
                }
            } catch (e) {
                console.error("Error procesando link de Drive", e);
            }
            return null;
        }

        function obtenerYoutubeId(url) {
            try {
                const direccion = new URL(url);
                const hostname = direccion.hostname.toLowerCase();
                if (hostname.includes("youtube.com")) {
                    const id = direccion.searchParams.get("v");
                    if id return id;
                }
                if (hostname === "youtu.be") {
                    return direccion.pathname.replace(/^\/+/, "").split("/")[0];
                }
                if (direccion.pathname.startsWith("/live/") || direccion.pathname.startsWith("/shorts/")) {
                    return direccion.pathname.split("/")[2];
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        function cargarContenidoEspejo() {
            const videoUrl = localStorage.getItem("videoUrl");
            const pantalla = document.getElementById("espejoScreen");

            if (!videoUrl) return;

            pantalla.innerHTML = "";

            if (videoUrl.toLowerCase().startsWith("<iframe")) {
                pantalla.innerHTML = videoUrl;
                const iframeElement = pantalla.querySelector("iframe");
                if (iframeElement) {
                    iframeElement.style.width = "100%";
                    iframeElement.style.height = "100%";
                    iframeElement.style.border = "none";
                }
                return;
            }

            const youtubeId = obtenerYoutubeId(videoUrl);
            if (youtubeId) {
                const iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(youtubeId) + "?autoplay=1";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;
                pantalla.appendChild(iframe);
                return;
            }

            const linkDrivePreview = convertirGoogleDrive(videoUrl);
            if (linkDrivePreview) {
                const iframe = document.createElement("iframe");
                iframe.src = linkDrivePreview;
                iframe.allow = "autoplay; fullscreen; picture-in-picture";
                iframe.allowFullscreen = true;
                pantalla.appendChild(iframe);
                return;
            }

            const iframe = document.createElement("iframe");
            iframe.src = videoUrl;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            pantalla.appendChild(iframe);
        }

        // Cargar al iniciar
        window.onload = function() {
            cargarContenidoEspejo();
        };

        // Escuchar cambios si se actualiza desde la ventana principal en tiempo real
        window.addEventListener("storage", function(event) {
            if (event.key === "videoUrl") {
                cargarContenidoEspejo();
            }
        });
    </script>

</body>
</html>
