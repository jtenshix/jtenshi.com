<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espejo - Control de Transmisión</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #espejoContainer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
            background: #000;
        }

        .empty {
            color: #555;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div id="espejoContainer">
        <div class="empty">Esperando transmisión...</div>
    </div>

    <script>
        const container = document.getElementById("espejoContainer");

        if (window.opener && window.opener.document) {
            const pantallaPrincipal = window.opener.document.getElementById("secondScreen");
            
            if (pantallaPrincipal) {
                // Copia exactamente lo que hay dentro del contenedor principal
                container.innerHTML = pantallaPrincipal.innerHTML;

                // Si lo que se está mostrando es una captura de pantalla (un elemento video con stream en vivo)
                const videoEspejo = container.querySelector("video");
                const videoPrincipal = pantallaPrincipal.querySelector("video");

                if (videoEspejo && videoPrincipal && videoPrincipal.srcObject) {
                    videoEspejo.srcObject = videoPrincipal.srcObject;
                    videoEspejo.muted = true; // Silenciado en el espejo para evitar eco
                    videoEspejo.play();
                }
            }
        }
    </script>

</body>

</html>
