<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espejo - Control de Transmisión</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #espejoContainer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
            background: #000;
        }

        .empty {
            color: #555;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div id="espejoContainer">
        <div class="empty">Esperando transmisión...</div>
    </div>

    <script>
        const container = document.getElementById("espejoContainer");

        // Si se abrió una captura de pantalla reciente en la sesión principal
        if (window.opener && window.opener.document) {
            const videoPrincipal = window.opener.document.querySelector("#secondScreen video");
            if (videoPrincipal && videoPrincipal.srcObject) {
                container.innerHTML = "";
                const videoEspejo = document.createElement("video");
                videoEspejo.srcObject = videoPrincipal.srcObject;
                videoEspejo.autoplay = true;
                videoEspejo.playsInline = true;
                videoEspejo.controls = false; // Sin controles para que quede limpio de pantalla completa
                container.appendChild(videoEspejo);
            }
        }

        // Si no hay video en vivo pero sí un link guardado en localStorage
        if (container.children.length > 0 && container.querySelector(".empty")) {
            const videoUrl = localStorage.getItem("videoUrl");
            if (videoUrl) {
                container.innerHTML = "";
                if (videoUrl.toLowerCase().startsWith("<iframe")) {
                    container.innerHTML = videoUrl;
                } else {
                    const iframe = document.createElement("iframe");
                    iframe.src = videoUrl;
                    iframe.allow = "autoplay; fullscreen; picture-in-picture";
                    container.appendChild(iframe);
                }
            }
        }
    </script>

</body>

</html>
