<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espejo de Transmisión</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .mirror-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #espejoScreen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #espejoScreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #espejoScreen video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="mirror-container">
        <div id="espejoScreen">
            <div class="empty-message">Esperando transmisión...</div>
        </div>
    </div>

    <script>
        function obtenerPlataforma(url) {
            url = url.trim();
            if (!url) return { tipo: null, canal: null };
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }
            try {
                const direccion = new URL(url);
                const host = direccion.hostname.toLowerCase();
                const partes = direccion.pathname.replace(/^\/+/, "").replace(/\/+$/, "").split("/");

                if (host.includes("twitch.tv")) {
                    return { tipo: "twitch", canal: partes[0] || null };
                }
                if (host.includes("kick.com")) {
                    return { tipo: "kick", canal: partes[0] || null };
                }
            } catch (error) {
                return { tipo: null, canal: null };
            }
            return { tipo: null, canal: null };
        }

        function obtenerYoutubeId(url) {
            try {
                const direccion = new URL(url);
                const hostname = direccion.hostname.toLowerCase();
                if (hostname.includes("youtube.com")) {
                    const id = direccion.searchParams.get("v");
                    if (id) return id;
                }
                if (hostname === "youtu.be") {
                    return direccion.pathname.replace(/^\/+/, "").split("/")[0];
                }
                if (direccion.pathname.startsWith("/live/") || direccion.pathname.startsWith("/shorts/")) {
                    return direccion.pathname.split("/")[2];
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        function convertirGoogleDrive(url) {
            try {
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    const fileId = match[1];
                    return `https://drive.google.com/file/d/${fileId}/preview`;
                }
            } catch (e) {
                console.error("Error procesando link de Drive", e);
            }
            return null;
        }

        function cargarContenidoEspejo(url) {
            const pantalla = document.getElementById("espejoScreen");
            if (!url) {
                pantalla.innerHTML = `<div class="empty-message">Esperando transmisión...</div>`;
                return;
            }

            pantalla.innerHTML = "";

            if (url.toLowerCase().startsWith("<iframe")) {
                pantalla.innerHTML = url;
                const iframeElement = pantalla.querySelector("iframe");
                if (iframeElement) {
                    iframeElement.style.width = "100%";
                    iframeElement.style.height = "100%";
                    iframeElement.style.border = "none";
                }
                return;
            }

            const youtubeId = obtenerYoutubeId(url);
            if (youtubeId) {
                const iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(youtubeId) + "?autoplay=1";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;
                pantalla.appendChild(iframe);
                return;
            }

            const linkDrivePreview = convertirGoogleDrive(url);
            if (linkDrivePreview) {
                const iframe = document.createElement("iframe");
                iframe.src = linkDrivePreview;
                iframe.allow = "autoplay; fullscreen; picture-in-picture";
                iframe.allowFullscreen = true;
                pantalla.appendChild(iframe);
                return;
            }

            const { tipo, canal } = obtenerPlataforma(url);
            if (tipo === "twitch") {
                const parent = window.location.hostname || "localhost";
                const iframe = document.createElement("iframe");
                iframe.src = `https://player.twitch.tv/?channel=${encodeURIComponent(canal)}&parent=${encodeURIComponent(parent)}&muted=false&autoplay=true`;
                iframe.allowFullscreen = true;
                iframe.allow = "autoplay; encrypted-media; fullscreen";
                pantalla.appendChild(iframe);
                return;
            }
            if (tipo === "kick") {
                const iframe = document.createElement("iframe");
                iframe.src = `https://player.kick.com/${encodeURIComponent(canal)}`;
                iframe.allowFullscreen = true;
                iframe.allow = "autoplay; encrypted-media; fullscreen";
                pantalla.appendChild(iframe);
                return;
            }

            const urlSinQuery = url.split("?")[0].toLowerCase();
            const esVideoDirecto = urlSinQuery.endsWith(".mp4") || urlSinQuery.endsWith(".webm") || urlSinQuery.endsWith(".ogg") || urlSinQuery.endsWith(".mov");

            if (esVideoDirecto) {
                const video = document.createElement("video");
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                pantalla.appendChild(video);
                return;
            }

            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            pantalla.appendChild(iframe);
        }

        // Revisar parámetros de la URL al abrir
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            let urlVideo = params.get("url");

            if (!urlVideo) {
                urlVideo = localStorage.getItem("espejo_video");
            }

            cargarContenidoEspejo(urlVideo);

            // Escuchar cambios en tiempo real si se actualiza desde la pestaña de control
            window.addEventListener("storage", function(e) {
                if (e.key === "espejo_video") {
                    cargarContenidoEspejo(e.newValue);
                }
            });
        };
    </script>

</body>
</html>
