<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Reacción</title>

    <!-- Evita el error 404 del favicon -->
    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶</text></svg>"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            background: #0f0f0f;
        }

        body {
            margin: 0;

            background: #0f0f0f;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;
        }


        /* =========================================
           BARRA SUPERIOR
        ========================================= */

        .topbar {

            width: 100%;

            background: #181818;

            padding: 14px 20px;

            display: flex;

            justify-content: center;
        }


        .search {

            width: 100%;

            max-width: 1100px;

            display: flex;

            gap: 10px;
        }


        .search input {

            flex: 1;

            height: 42px;

            padding: 0 14px;

            border: 1px solid #333;

            border-radius: 6px;

            outline: none;

            background: #242424;

            color: white;

            font-size: 15px;
        }


        .search input:focus {

            border-color: #666;
        }


        .search input::placeholder {

            color: #999;
        }


        .search button {

            height: 42px;

            padding: 0 22px;

            border: none;

            border-radius: 6px;

            background: #9147ff;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .search button:hover {

            background: #772ce8;
        }


        /* =========================================
           CONTENEDOR PRINCIPAL
        ========================================= */

        .content {

            width: 100%;

            max-width: 1200px;

            margin: 30px auto;

            padding: 0 20px;
        }


        /* =========================================
           ZONA TWITCH
        ========================================= */

        .twitch-section {

            display: grid;

            grid-template-columns:
                minmax(0, 900px)
                300px;

            gap: 20px;

            align-items: start;

            justify-content: center;
        }


        /* =========================================
           VIDEO 16:9
        ========================================= */

        .player {

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: 8px;

            overflow: hidden;
        }


        .player iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;
        }


        /* =========================================
           CHAT
        ========================================= */

        .chat {

            width: 100%;

            height: 506px;

            background: #181818;

            border-radius: 8px;

            overflow: hidden;
        }


        .chat iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;
        }


        /* =========================================
           SEGUNDA PANTALLA
           Por ahora es solamente un espacio.
           Después pondremos aquí el otro vídeo.
        ========================================= */

        .second-section {

            width: 100%;

            max-width: 900px;

            margin: 35px auto 60px;

            display: none;
        }


        .second-title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 12px;
        }


        .second-screen {

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: 8px;

            overflow: hidden;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            .twitch-section {

                grid-template-columns: 1fr;

            }


            .chat {

                height: 400px;

            }

        }


        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            .topbar {

                padding: 10px;

            }


            .search {

                flex-direction: column;

            }


            .search button {

                width: 100%;

            }


            .content {

                padding: 0 10px;

                margin-top: 15px;

            }


            .player {

                border-radius: 4px;

            }


            .chat {

                height: 400px;

                border-radius: 4px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         BARRA DE LINK
    ========================================= -->

    <header class="topbar">

        <div class="search">

            <input
                id="twitchUrl"
                type="text"
                placeholder="Pega aquí el link de Twitch..."
                autocomplete="off"
            >

            <button onclick="cargarTwitch()">
                CARGAR
            </button>

        </div>

    </header>



    <!-- =========================================
         CONTENIDO
    ========================================= -->

    <main class="content">


        <!-- =====================================
             TWITCH + CHAT
        ===================================== -->

        <section class="twitch-section">


            <!-- Twitch -->

            <div class="player">

                <iframe
                    id="twitchPlayer"
                    allowfullscreen
                    title="Twitch Player">
                </iframe>

            </div>


            <!-- Chat -->

            <div class="chat">

                <iframe
                    id="twitchChat"
                    title="Twitch Chat">
                </iframe>

            </div>


        </section>



        <!-- =====================================
             SEGUNDA PANTALLA

             Se activará más adelante.
        ===================================== -->

        <section
            class="second-section"
            id="secondSection"
        >

            <div class="second-title">
                Segunda pantalla
            </div>

            <div class="second-screen">

                <!-- Aquí irá el segundo reproductor -->

            </div>

        </section>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /*
         * Obtiene el nombre del canal
         * desde el link de Twitch.
         */

        function obtenerCanal(url) {

            url = url.trim();


            if (!url) {

                return null;

            }


            /*
             * Si el usuario escribe:
             *
             * twitch.tv/canal
             *
             * agregamos https://
             */

            if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
            ) {

                url = "https://" + url;

            }


            try {

                const direccion = new URL(url);


                /*
                 * Comprobamos que realmente
                 * sea Twitch.
                 */

                if (
                    !direccion.hostname
                        .toLowerCase()
                        .includes("twitch.tv")
                ) {

                    return null;

                }


                let canal =
                    direccion.pathname
                        .replace(/^\/+/, "")
                        .replace(/\/+$/, "");


                if (!canal) {

                    return null;

                }


                /*
                 * Nos quedamos solamente
                 * con el nombre del canal.
                 */

                return canal.split("/")[0];

            }

            catch (error) {

                return null;

            }

        }



        /*
         * Carga el reproductor y el chat.
         */

        function cargarTwitch() {


            const input =
                document.getElementById("twitchUrl");


            const url =
                input.value;


            const canal =
                obtenerCanal(url);



            if (!canal) {

                alert(
                    "Introduce un enlace válido de Twitch.\n\n" +
                    "Ejemplo:\n" +
                    "https://www.twitch.tv/nombrecanal"
                );

                return;

            }



            /*
             * Dominio actual.
             *
             * GitHub Pages proporcionará algo como:
             *
             * usuario.github.io
             */

            const parent =
                window.location.hostname;



            /*
             * =====================================
             * TWITCH PLAYER OFICIAL
             * =====================================
             */

            const player =
                document.getElementById("twitchPlayer");


            player.src =
                "https://player.twitch.tv/" +
                "?channel=" +
                encodeURIComponent(canal) +
                "&parent=" +
                encodeURIComponent(parent);



            /*
             * =====================================
             * CHAT OFICIAL DE TWITCH
             * =====================================
             */

            const chat =
                document.getElementById("twitchChat");


            chat.src =
                "https://www.twitch.tv/embed/" +
                encodeURIComponent(canal) +
                "/chat" +
                "?parent=" +
                encodeURIComponent(parent);

        }



        /*
         * ENTER también carga el canal.
         */

        document
            .getElementById("twitchUrl")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        cargarTwitch();

                    }

                }
            );


    </script>


</body>

</html>
