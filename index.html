<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Stream</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #0e0e10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .panel-container {
            max-width: 600px;
            margin: 0 auto;
            background: #18181b;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #303033;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #bf94ff;
            border-bottom: 1px solid #303033;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0e0e10;
            border: 1px solid #303033;
            border-radius: 4px;
            color: white;
            font-size: 14px;
        }

        input[type="text"]:focus {
            border-color: #9147ff;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button, a.btn-link {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-guardar {
            background: #9147ff;
            color: white;
        }

        .btn-guardar:hover {
            background: #772ce8;
        }

        .btn-espejo {
            background: #2f2f35;
            color: white;
            border: 1px solid #46464f;
        }

        .btn-espejo:hover {
            background: #3a3a42;
        }

        .status-msg {
            margin-top: 12px;
            font-size: 13px;
            color: #00ff7f;
            text-align: center;
            height: 18px;
        }
    </style>
</head>

<body>
    <div class="panel-container">
        <h2>Panel de Configuración</h2>
        
        <div class="form-group">
            <label for="twitchUrl">Canal de Twitch (URL o nombre):</label>
            <input type="text" id="twitchUrl" placeholder="Ej: https://www.twitch.tv/tu_canal">
        </div>

        <div class="form-group">
            <label for="videoUrl">Video Principal (YouTube, MP4, etc.):</label>
            <input type="text" id="videoUrl" placeholder="Ej: https://www.youtube.com/watch?v=...">
        </div>

        <div class="btn-group">
            <button class="btn-guardar" onclick="guardarDatos()">Guardar Cambios</button>
            <a id="linkEspejo" href="mi-sitio-web.html" target="_blank" class="btn-espejo">Abrir Espejo ↗</a>
        </div>

        <div id="mensajeEstado" class="status-msg"></div>
    </div>

    <script>
        // Cargar datos previos al abrir el panel
        window.addEventListener("DOMContentLoaded", () => {
            const twitchGuardado = localStorage.getItem("stream_twitch") || "";
            const videoGuardado = localStorage.getItem("stream_video") || "";

            document.getElementById("twitchUrl").value = twitchGuardado;
            document.getElementById("videoUrl").value = videoGuardado;

            actualizarEnlaceEspejo(twitchGuardado, videoGuardado);
        });

        function guardarDatos() {
            const twitchVal = document.getElementById("twitchUrl").value.trim();
            const videoVal = document.getElementById("videoUrl").value.trim();

            // Guardar en localStorage para que el espejo los lea al actualizar
            localStorage.setItem("stream_twitch", twitchVal);
            localStorage.setItem("stream_video", videoVal);

            actualizarEnlaceEspejo(twitchVal, videoVal);

            const msg = document.getElementById("mensajeEstado");
            msg.textContent = "¡Cambios guardados con éxito!";
            setTimeout(() => {
                msg.textContent = "";
            }, 3000);
        }

        function actualizarEnlaceEspejo(twitch, video) {
            const linkEspejo = document.getElementById("linkEspejo");
            const params = new URLSearchParams();
            if (twitch) params.set("twitch", twitch);
            if (video) params.set("video", video);

            linkEspejo.href = "mi-sitio-web.html" + (params.toString() ? "?" + params.toString() : "");
        }
    </script>
</body>

</html>
