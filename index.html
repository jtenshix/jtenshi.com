<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control de Transmisión</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0b;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   BARRA SUPERIOR
========================= */

.topbar {
    height: 60px;
    background: #151515;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 15px;
    border-bottom: 1px solid #292929;
}

.topbar input {
    flex: 1;
    height: 40px;
    padding: 0 14px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #0d0d0d;
    color: white;
    outline: none;
}

.topbar input:focus {
    border-color: #9147ff;
}

.topbar button {
    height: 40px;
    padding: 0 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    color: white;
    background: #9147ff;
}

.topbar button:hover {
    opacity: 0.9;
}

.topbar .mirror-button {
    background: #00a86b;
}


/* =========================
   CONTENEDOR PRINCIPAL
========================= */

.main {
    height: calc(100vh - 60px);
    display: grid;
    grid-template-columns: 250px minmax(400px, 1fr) 320px;
    gap: 10px;
    padding: 10px;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    min-width: 0;
    min-height: 0;
    background: #111;
    border: 1px solid #292929;
    border-radius: 8px;
    padding: 10px;
    overflow-y: auto;
}

.sidebar-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}


/* =========================
   TWITCH
========================= */

.streamer-widget {
    width: 100%;
    height: 290px;
    position: relative;
    overflow: hidden;
    background: #000;
    border-radius: 6px;
}

/*
    LA CAJA VISIBLE SIGUE MIDiendo 290px.

    Solamente hacemos que el contenido interno
    de Twitch sea más alto.

    No usamos top negativo.
*/

#twitchPlayer {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 430px;
    overflow: hidden;
    background: #000;
}

#twitchPlayer iframe {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 430px;
    border: none;
    display: block;
}


/* =========================
   MENSAJE VACÍO
========================= */

.empty-message {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 14px;
}


/* =========================
   BOTONES SIDEBAR
========================= */

.sidebar button {
    width: 100%;
    height: 40px;
    margin-top: 8px;
    border: none;
    border-radius: 6px;
    background: #252525;
    color: white;
    cursor: pointer;
}

.sidebar button:hover {
    background: #333;
}


/* =========================
   ENLACES
========================= */

.donation-links {
    margin-top: 15px;
}

.donation-links a {
    display: block;
    color: #bbb;
    text-decoration: none;
    padding: 7px 0;
    font-size: 13px;
}

.donation-links a:hover {
    color: white;
}


/* =========================
   CENTRO
========================= */

.center {
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;
    gap: 10px;
}


/* =========================
   SEGUNDO VIDEO
========================= */

.video-box {
    flex: 1;
    min-height: 0;

    background: #000;
    border: 1px solid #292929;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}

#secondVideo {
    width: 100%;
    height: 100%;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;
}

#secondVideo iframe,
#secondVideo video {
    width: 100%;
    height: 100%;
    border: none;
}


/* =========================
   CONTROLES VIDEO
========================= */

.video-controls {
    height: 50px;
    display: flex;
    gap: 8px;
}

.video-controls input {
    flex: 1;

    background: #111;
    color: white;

    border: 1px solid #333;
    border-radius: 6px;

    padding: 0 12px;
    outline: none;
}

.video-controls button {
    width: 100px;

    border: none;
    border-radius: 6px;

    background: #9147ff;
    color: white;

    font-weight: bold;
    cursor: pointer;
}


/* =========================
   CHAT
========================= */

.chat-column {
    min-width: 0;
    min-height: 0;

    background: #111;
    border: 1px solid #292929;
    border-radius: 8px;

    overflow: hidden;
}

.chat-column iframe {
    width: 100%;
    height: 100%;
    border: none;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1000px) {

    .main {
        grid-template-columns: 220px 1fr;
    }

    .chat-column {
        display: none;
    }
}


@media (max-width: 700px) {

    .main {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: none;
    }
}

</style>
</head>


<body>


<!-- =========================
     BARRA SUPERIOR
========================= -->

<div class="topbar">

    <input
        type="text"
        id="twitchUrl"
        placeholder="Pega aquí el link de Twitch de la streamer..."
    >

    <button onclick="cargarTwitch()">
        CARGAR STREAMER
    </button>

    <button
        class="mirror-button"
        onclick="abrirEspejo()">
        🔗 Abrir Espejo
    </button>

</div>


<!-- =========================
     CONTENIDO PRINCIPAL
========================= -->

<div class="main">


    <!-- =====================
         COLUMNA IZQUIERDA
    ====================== -->

    <div class="sidebar">

        <div class="sidebar-title">
            STREAMER
        </div>


        <div class="streamer-widget">

            <div id="twitchPlayer">

                <div
                    class="empty-message"
                    style="background:#111;">
                    Sin canal cargado
                </div>

            </div>

        </div>


        <button onclick="forzarPlayTwitch()">
            <i class="fa-solid fa-play"></i>
            Play
        </button>


        <button onclick="recargarStreamer()">
            <i class="fa-solid fa-rotate"></i>
            Recargar
        </button>


        <div class="donation-links">

            <div class="sidebar-title">
                ENLACES
            </div>


            <a href="#" target="_blank">
                <i class="fa-solid fa-gift"></i>
                Donaciones
            </a>


            <a href="#" target="_blank">
                <i class="fa-brands fa-twitter"></i>
                Twitter
            </a>


            <a href="#" target="_blank">
                <i class="fa-brands fa-instagram"></i>
                Instagram
            </a>

        </div>

    </div>


    <!-- =====================
         COLUMNA CENTRAL
    ====================== -->

    <div class="center">


        <div class="video-box">

            <div id="secondVideo">

                <div class="empty-message">
                    Sin video cargado
                </div>

            </div>

        </div>


        <div class="video-controls">

            <input
                type="text"
                id="videoUrl"
                placeholder="Pega aquí el link del segundo video..."
            >

            <button onclick="cargarSegundoVideo()">
                CARGAR
            </button>

        </div>

    </div>


    <!-- =====================
         CHAT
    ====================== -->

    <div class="chat-column">

        <iframe
            id="twitchChat"
            src=""
            allowfullscreen>
        </iframe>

    </div>

</div>


<script>


/* =========================
   GUARDAR DATOS DE SESIÓN
========================= */

function guardarDatosSesion(twitchUrl, videoUrl) {

    localStorage.setItem(
        "twitchUrl",
        twitchUrl || ""
    );

    localStorage.setItem(
        "videoUrl",
        videoUrl || ""
    );
}


/* =========================
   ABRIR ESPEJO
========================= */

function abrirEspejo() {

    const twitchUrl =
        document
            .getElementById("twitchUrl")
            .value
            .trim();

    const videoUrl =
        document
            .getElementById("videoUrl")
            .value
            .trim();


    guardarDatosSesion(
        twitchUrl,
        videoUrl
    );


    window.open(
        "espejo.html",
        "_blank"
    );
}


/* =========================
   OBTENER CANAL
========================= */

function obtenerCanal(url) {

    try {

        if (!url) {
            return null;
        }


        let texto = url.trim();


        if (
            !texto.startsWith("http://") &&
            !texto.startsWith("https://")
        ) {
            texto = "https://" + texto;
        }


        const parsed =
            new URL(texto);


        if (
            !parsed.hostname
                .toLowerCase()
                .includes("twitch.tv")
        ) {
            return null;
        }


        const partes =
            parsed.pathname
                .split("/")
                .filter(Boolean);


        if (!partes.length) {
            return null;
        }


        return partes[0];

    } catch (error) {

        return null;

    }
}


/* =========================
   CARGAR TWITCH
========================= */

function cargarTwitch() {

    const input =
        document.getElementById(
            "twitchUrl"
        );


    const twitchUrl =
        input.value.trim();


    const canal =
        obtenerCanal(twitchUrl);


    if (!canal) {

        alert(
            "Ingresa un link válido de Twitch."
        );

        return;
    }


    const videoUrl =
        document
            .getElementById("videoUrl")
            .value
            .trim();


    guardarDatosSesion(
        twitchUrl,
        videoUrl
    );


    /* =====================
       PLAYER TWITCH
    ====================== */

    const playerDiv =
        document.getElementById(
            "twitchPlayer"
        );


    playerDiv.innerHTML = "";


    const parent =
        window.location.hostname ||
        "localhost";


    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.src =
        "https://player.twitch.tv/?" +
        "channel=" +
        encodeURIComponent(canal) +
        "&parent=" +
        encodeURIComponent(parent) +
        "&muted=true" +
        "&autoplay=true";


    iframe.allowFullscreen =
        true;


    iframe.allow =
        "autoplay; encrypted-media; fullscreen";


    playerDiv.appendChild(
        iframe
    );


    /* =====================
       CHAT TWITCH
    ====================== */

    const chat =
        document.getElementById(
            "twitchChat"
        );


    chat.src =
        "https://www.twitch.tv/embed/" +
        encodeURIComponent(canal) +
        "/chat?parent=" +
        encodeURIComponent(parent);
}


/* =========================
   RECARGAR STREAMER
========================= */

function recargarStreamer() {

    const input =
        document.getElementById(
            "twitchUrl"
        );


    if (
        input.value.trim()
    ) {

        cargarTwitch();

    }
}


/* =========================
   PLAY TWITCH
========================= */

function forzarPlayTwitch() {

    const input =
        document.getElementById(
            "twitchUrl"
        );


    if (
        input.value.trim()
    ) {

        cargarTwitch();

    }
}


/* =========================
   OBTENER ID YOUTUBE
========================= */

function obtenerYoutubeId(url) {

    try {

        const parsed =
            new URL(url);


        if (
            parsed.hostname.includes(
                "youtu.be"
            )
        ) {

            return parsed.pathname
                .replace("/", "")
                .split("?")[0];

        }


        if (
            parsed.hostname.includes(
                "youtube.com"
            )
        ) {

            return parsed.searchParams
                .get("v");

        }


        return null;

    } catch (error) {

        return null;

    }
}


/* =========================
   CARGAR SEGUNDO VIDEO
========================= */

function cargarSegundoVideo() {

    const url =
        document
            .getElementById("videoUrl")
            .value
            .trim();


    const container =
        document.getElementById(
            "secondVideo"
        );


    if (!url) {

        container.innerHTML =
            '<div class="empty-message">' +
            'Sin video cargado' +
            '</div>';

        return;
    }


    guardarDatosSesion(

        document
            .getElementById("twitchUrl")
            .value
            .trim(),

        url
    );


    /* =====================
       YOUTUBE
    ====================== */

    const youtubeId =
        obtenerYoutubeId(url);


    if (youtubeId) {

        container.innerHTML =

            '<iframe ' +
            'src="https://www.youtube.com/embed/' +
            encodeURIComponent(
                youtubeId
            ) +
            '?autoplay=1&rel=0" ' +
            'allow="autoplay; encrypted-media; fullscreen" ' +
            'allowfullscreen>' +
            '</iframe>';

        return;
    }


    /* =====================
       VIDEO DIRECTO
    ====================== */

    const lowerUrl =
        url.toLowerCase();


    if (
        lowerUrl.endsWith(".mp4") ||
        lowerUrl.endsWith(".webm") ||
        lowerUrl.endsWith(".ogg") ||
        lowerUrl.endsWith(".mov")
    ) {

        container.innerHTML =

            '<video ' +
            'src="' +
            encodeURI(url) +
            '" ' +
            'controls ' +
            'autoplay ' +
            'playsinline>' +
            '</video>';

        return;
    }


    /* =====================
       IFRAME GENÉRICO
    ====================== */

    container.innerHTML =

        '<iframe ' +
        'src="' +
        encodeURI(url) +
        '" ' +
        'allow="autoplay; encrypted-media; fullscreen" ' +
        'allowfullscreen>' +
        '</iframe>';
}


/* =========================
   ENTER EN TWITCH
========================= */

document
    .getElementById("twitchUrl")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                cargarTwitch();

            }

        }
    );


/* =========================
   ENTER EN VIDEO
========================= */

document
    .getElementById("videoUrl")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                cargarSegundoVideo();

            }

        }
    );


/* =========================
   RECUPERAR SESIÓN
========================= */

window.addEventListener(
    "load",
    function() {

        const twitchUrl =
            localStorage.getItem(
                "twitchUrl"
            );


        const videoUrl =
            localStorage.getItem(
                "videoUrl"
            );


        if (twitchUrl) {

            document
                .getElementById(
                    "twitchUrl"
                )
                .value = twitchUrl;

            cargarTwitch();

        }


        if (videoUrl) {

            document
                .getElementById(
                    "videoUrl"
                )
                .value = videoUrl;

            cargarSegundoVideo();

        }

    }
);

</script>

</body>
</html>
