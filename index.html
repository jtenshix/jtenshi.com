```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal Twitch</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Barra superior */

        .topbar {
            height: 64px;
            width: 100%;
            background: #181818;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 10px 14px;
        }

        .topbar input {
            flex: 1;

            height: 42px;

            border: none;
            outline: none;

            border-radius: 6px;

            padding: 0 14px;

            background: #292929;
            color: white;

            font-size: 15px;
        }

        .topbar input::placeholder {
            color: #999;
        }

        .topbar button {
            height: 42px;

            border: none;
            border-radius: 6px;

            padding: 0 20px;

            background: #9147ff;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .topbar button:hover {
            background: #772ce8;
        }

        /* Contenedor principal */

        .layout {
            width: 100%;
            height: calc(100vh - 64px);

            display: grid;

            grid-template-columns: minmax(0, 1fr) 340px;
        }

        /* Twitch */

        .player {
            width: 100%;
            height: 100%;

            background: #000;
        }

        .player iframe {
            width: 100%;
            height: 100%;

            border: none;
            display: block;
        }

        /* Chat */

        .chat {
            width: 100%;
            height: 100%;

            background: #181818;

            border-left: 1px solid #292929;
        }

        .chat iframe {
            width: 100%;
            height: 100%;

            border: none;
            display: block;
        }

        /* Pantallas pequeñas */

        @media (max-width: 800px) {

            html,
            body {
                overflow: auto;
            }

            .layout {
                height: auto;

                grid-template-columns: 1fr;
                grid-template-rows: 70vh 400px;
            }

            .player {
                height: 70vh;
            }

            .chat {
                height: 400px;

                border-left: none;
                border-top: 1px solid #292929;
            }
        }
    </style>
</head>

<body>

    <!-- Barra para introducir el link -->

    <div class="topbar">

        <input
            id="twitchUrl"
            type="text"
            placeholder="Pega aquí el link del canal de Twitch..."
            autocomplete="off"
        >

        <button onclick="cargarTwitch()">
            CARGAR
        </button>

    </div>


    <!-- Contenido -->

    <main class="layout">

        <!-- Reproductor oficial de Twitch -->

        <section class="player">

            <iframe
                id="twitchPlayer"
                allowfullscreen
                title="Twitch Player">
            </iframe>

        </section>


        <!-- Chat oficial de Twitch -->

        <section class="chat">

            <iframe
                id="twitchChat"
                title="Twitch Chat">
            </iframe>

        </section>

    </main>


    <script>

        /*
         * Obtiene el nombre del canal
         * a partir de una URL de Twitch.
         *
         * Ejemplos:
         *
         * https://www.twitch.tv/canal
         * twitch.tv/canal
         * https://twitch.tv/canal/
         */

        function obtenerCanal(url) {

            url = url.trim();

            if (!url) {
                return null;
            }

            if (!url.startsWith("http://") &&
                !url.startsWith("https://")) {

                url = "https://" + url;
            }

            try {

                const direccion = new URL(url);

                if (!direccion.hostname.includes("twitch.tv")) {
                    return null;
                }

                let canal = direccion.pathname
                    .replace(/^\/+/, "")
                    .replace(/\/+$/, "");

                if (!canal) {
                    return null;
                }

                return canal.split("/")[0];

            } catch (error) {

                return null;
            }
        }


        /*
         * Carga Twitch
         */

        function cargarTwitch() {

            const input =
                document.getElementById("twitchUrl");

            const url = input.value;

            const canal = obtenerCanal(url);


            if (!canal) {

                alert(
                    "Introduce un enlace válido de Twitch.\n\n" +
                    "Ejemplo:\n" +
                    "https://www.twitch.tv/nombrecanal"
                );

                return;
            }


            /*
             * Dominio actual de GitHub Pages.
             *
             * Twitch necesita este valor para
             * permitir el reproductor embebido.
             */

            const parent =
                window.location.hostname;


            /*
             * Reproductor oficial de Twitch
             */

            const player =
                document.getElementById("twitchPlayer");

            player.src =
                "https://player.twitch.tv/" +
                "?channel=" +
                encodeURIComponent(canal) +
                "&parent=" +
                encodeURIComponent(parent);


            /*
             * Chat oficial de Twitch
             */

            const chat =
                document.getElementById("twitchChat");

            chat.src =
                "https://www.twitch.tv/embed/" +
                encodeURIComponent(canal) +
                "/chat" +
                "?parent=" +
                encodeURIComponent(parent);
        }


        /*
         * También permite pulsar ENTER
         * dentro del campo.
         */

        document
            .getElementById("twitchUrl")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    cargarTwitch();
                }
            });

    </script>

</body>
</html>
