<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Transmisión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .topbar {
            width: 100%;
            background: #18181b;
            padding: 10px 18px;
            border-bottom: 1px solid #303033;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .search input {
            flex: 1;
            height: 38px;
            padding: 0 14px;
            border: 1px solid #3a3a3d;
            border-radius: 6px;
            outline: none;
            background: #1f1f23;
            color: white;
            font-size: 14px;
        }

        .search input:focus {
            border-color: #9147ff;
        }

        .search input::placeholder {
            color: #aaa;
        }

        .search button {
            height: 38px;
            padding: 0 20px;
            border: none;
            border-radius: 6px;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .search button:hover {
            background: #772ce8;
        }

        .btn-espejo {
            height: 38px;
            padding: 0 16px;
            border: none;
            border-radius: 6px;
            background: #00e676;
            color: black;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-espejo:hover {
            background: #00c853;
        }

        .twitch-quick-actions {
            display: flex;
            gap: 8px;
        }

        .q-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            transition: opacity 0.2s;
        }

        .q-btn:hover {
            opacity: 0.85;
        }

        .btn-seguir { background: #9147ff; }
        .btn-regalar { background: #3a3a3d; }
        .btn-sub { background: #2f2f35; border: 1px solid #53535f; }

        .layout {
            flex: 1;
            width: 100%;
            margin: 0;
            padding: 16px;
            display: flex;
            min-height: 0;
        }

        .stream-layout {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(320px, 1fr) minmax(0, 2.2fr) minmax(300px, 1fr);
            gap: 16px;
            align-items: stretch;
            height: 100%;
        }

        .sidebar-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;
        }

        .recommended-section {
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .streamer-widget-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            padding: 10px;
            gap: 10px;
            justify-content: center;
        }

        .streamer-widget {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 15;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        #twitchPlayer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #twitchPlayer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .donation-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 8px;
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .donation-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 2px;
            background: #1f1f23;
            border: 1px solid #3a3a3d;
            border-radius: 5px;
            color: #efeff1;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }

        .donation-btn i {
            font-size: 16px;
        }

        .donation-btn:hover {
            background: #2d2d30;
            border-color: #9147ff;
        }

        .stream-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            height: 34px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-play {
            background: #9147ff;
            color: white;
        }

        .btn-play:hover {
            background: #772ce8;
        }

        .ctrl-btn.btn-recargar {
            background: #ff9800;
            color: black;
        }

        .ctrl-btn.btn-recargar:hover {
            background: #f57c00;
        }

        .center-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;
        }

        .video-area {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #303033;
            min-height: 0;
        }

        #secondScreen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #secondScreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #secondScreen video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 15px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .video-input {
            width: 100%;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .video-input input {
            flex: 1;
            height: 38px;
            padding: 0 14px;
            border: 1px solid #3a3a3d;
            border-radius: 6px;
            outline: none;
            background: #1f1f23;
            color: white;
            font-size: 14px;
        }

        .video-input input:focus {
            border-color: #9147ff;
        }

        .video-input button {
            height: 38px;
            padding: 0 20px;
            border: none;
            border-radius: 6px;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .video-input button:hover {
            background: #772ce8;
        }

        .chat-area {
            width: 100%;
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .chat-header {
            height: 38px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px solid #303033;
        }

        .chat-frame {
            flex: 1;
            min-height: 0;
        }

        .chat-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .error {
            display: none;
            margin-top: 5px;
            padding: 8px;
            border-radius: 6px;
            background: #2a1717;
            color: #ffaaaa;
            font-size: 13px;
            flex-shrink: 0;
        }

        @media (max-width: 1100px) {
            html, body {
                overflow: auto;
            }
            .stream-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .sidebar-left, .center-area, .chat-area {
                height: 450px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="search">
            <input id="twitchUrl" type="text" placeholder="Pega aquí el link de Twitch de la streamer..." autocomplete="off">
            <button onclick="cargarTwitch()">CARGAR STREAMER</button>
            <button class="btn-espejo" onclick="abrirEspejo()">🔗 Abrir Espejo</button>
        </div>
        <div class="twitch-quick-actions">
            <a id="btnSeguir" href="#" target="_blank" class="q-btn btn-seguir"><i class="fa-solid fa-heart"></i> Seguir</a>
            <a id="btnRegalar" href="#" target="_blank" class="q-btn btn-regalar"><i class="fa-solid fa-gift"></i> Regalar</a>
            <a id="btnSub" href="#" target="_blank" class="q-btn btn-sub"><i class="fa-solid fa-star"></i> Suscribirse</a>
        </div>
    </header>

    <main class="layout">
        <div class="stream-layout">
            <aside class="sidebar-left">
                <div class="recommended-section">
                    <div class="streamer-widget-content">
                        <div class="streamer-widget">
                            <div id="twitchPlayer">
                                <div class="empty-message" style="background:#111;">Sin canal cargado</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="donation-links">
                    <a href="https://ko-fi.com/cotecreator/shop" target="_blank" class="donation-btn" title="Ko-fi">
                        <i class="fa-solid fa-mug-hot" style="color: #29abe0;"></i>
                        Ko-fi
                    </a>
                    <a href="https://ceneka.net/coteparrague" target="_blank" class="donation-btn" title="Ceneka">
                        <i class="fa-solid fa-heart" style="color: #ff4757;"></i>
                        Ceneka
                    </a>
                    <a href="https://streamelements.com/coteparrague/tip" target="_blank" class="donation-btn" title="StreamElements">
                        <i class="fa-solid fa-hand-holding-dollar" style="color: #2ed573;"></i>
                        Tips
                    </a>
                </div>

                <div class="stream-controls">
                    <button class="ctrl-btn btn-play" onclick="forzarPlayTwitch()"><i class="fa-solid fa-play"></i> Play</button>
                    <button class="ctrl-btn btn-recargar" onclick="recargarStreamer()"><i class="fa-solid fa-rotate"></i> Recargar</button>
                </div>
            </aside>

            <section class="center-area">
                <div class="video-area">
                    <div id="secondScreen">
                        <div class="empty-message">
                            Pega abajo el link del vídeo principal
                        </div>
                    </div>
                </div>

                <div class="video-input">
                    <input id="videoUrl" type="text" placeholder="Pega aquí el link del vídeo principal..." autocomplete="off">
                    <button onclick="cargarSegundoVideo()">CARGAR VIDEO</button>
                </div>
                <div id="videoError" class="error"></div>
            </section>

            <aside class="chat-area">
                <div class="chat-header">
                    Chat del stream
                </div>
                <div class="chat-frame">
                    <iframe id="twitchChat" title="Chat de Twitch"></iframe>
                </div>
            </aside>
        </div>
    </main>

    <script>
        function guardarDatosSesion(twitchUrl, videoUrl) {
            localStorage.setItem("twitchUrl", twitchUrl);
            localStorage.setItem("videoUrl", videoUrl);
        }

        function abrirEspejo() {
            const twitchUrl = document.getElementById("twitchUrl").value.trim();
            const videoUrl = document.getElementById("videoUrl").value.trim();
            guardarDatosSesion(twitchUrl, videoUrl);
            window.open("espejo.html", "_blank");
        }

        function obtenerCanal(url) {
            url = url.trim();
            if (!url) return null;
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }
            try {
                const direccion = new URL(url);
                if (!direccion.hostname.toLowerCase().includes("twitch.tv")) return null;
                const partes = direccion.pathname.replace(/^\/+/, "").replace(/\/+$/, "").split("/");
                return partes[0] || null;
            } catch (error) {
                return null;
            }
        }

        function cargarTwitch() {
            const input = document.getElementById("twitchUrl");
            const urlVal = input.value.trim();
            const canal = obtenerCanal(urlVal);

            if (!canal) {
                alert("Introduce un link válido de Twitch.");
                return;
            }

            const videoUrl = document.getElementById("videoUrl").value.trim();
            guardarDatosSesion(urlVal, videoUrl);

            const canalUrl = `https://www.twitch.tv/${encodeURIComponent(canal)}`;
            document.getElementById("btnSeguir").href = canalUrl;
            document.getElementById("btnRegalar").href = `${canalUrl}/subscribe`;
            document.getElementById("btnSub").href = `${canalUrl}/subscribe`;

            const parent = window.location.hostname || "localhost";
            const playerDiv = document.getElementById("twitchPlayer");
            playerDiv.innerHTML = "";

            const iframe = document.createElement("iframe");
            iframe.src = `https://player.twitch.tv/?channel=${encodeURIComponent(canal)}&parent=${encodeURIComponent(parent)}&muted=true&autoplay=true`;
            iframe.allowFullscreen = true;
            iframe.allow = "autoplay; encrypted-media; fullscreen";
            playerDiv.appendChild(iframe);

            const chat = document.getElementById("twitchChat");
            chat.src = "https://www.twitch.tv/embed/" + encodeURIComponent(canal) + "/chat?parent=" + encodeURIComponent(parent);
        }

        function recargarStreamer() {
            const input = document.getElementById("twitchUrl");
            if (input.value.trim()) {
                cargarTwitch();
            }
        }

        function forzarPlayTwitch() {
            const input = document.getElementById("twitchUrl");
            if (input.value.trim()) {
                cargarTwitch();
            }
        }

        function obtenerYoutubeId(url) {
            try {
                const direccion = new URL(url);
                const hostname = direccion.hostname.toLowerCase();
                if (hostname.includes("youtube.com")) {
                    const id = direccion.searchParams.get("v");
                    if (id) return id;
                }
                if (hostname === "youtu.be") {
                    return direccion.pathname.replace(/^\/+/, "").split("/")[0];
                }
                if (direccion.pathname.startsWith("/live/") || direccion.pathname.startsWith("/shorts/")) {
                    return direccion.pathname.split("/")[2];
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        function cargarSegundoVideo() {
            const input = document.getElementById("videoUrl");
            const url = input.value.trim();
            const pantalla = document.getElementById("secondScreen");
            const error = document.getElementById("videoError");

            if (!url) return;

            const twitchUrl = document.getElementById("twitchUrl").value.trim();
            guardarDatosSesion(twitchUrl, url);

            pantalla.innerHTML = "";
            error.style.display = "none";

            const youtubeId = obtenerYoutubeId(url);
            if (youtubeId) {
                const iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(youtubeId) + "?autoplay=1";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;
                iframe.title = "Vídeo de YouTube";
                pantalla.appendChild(iframe);
                return;
            }

            const urlSinQuery = url.split("?")[0].toLowerCase();
            const esVideoDirecto = urlSinQuery.endsWith(".mp4") || urlSinQuery.endsWith(".webm") || urlSinQuery.endsWith(".ogg") || urlSinQuery.endsWith(".mov");

            if (esVideoDirecto) {
                const video = document.createElement("video");
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                video.preload = "metadata";
                pantalla.appendChild(video);
                return;
            }

            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            iframe.title = "Segundo vídeo";
            pantalla.appendChild(iframe);
        }

        document.getElementById("twitchUrl").addEventListener("keydown", function(event) {
            if (event.key === "Enter") cargarTwitch();
        });

        document.getElementById("videoUrl").addEventListener("keydown", function(event) {
            if (event.key === "Enter") cargarSegundoVideo();
        });
    </script>

</body>

</html>
