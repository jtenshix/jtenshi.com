<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Reacción</title>

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶</text></svg>"
    >

    <!-- HLS para vídeos .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html {
            background: #0f0f0f;
        }


        body {
            margin: 0;
            background: #0f0f0f;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;
        }


        /* =========================================
           BARRA SUPERIOR
        ========================================= */

        .topbar {

            width: 100%;

            background: #181818;

            padding: 14px 20px;

            display: flex;

            justify-content: center;
        }


        .search {

            width: 100%;

            max-width: 1100px;

            display: flex;

            gap: 10px;
        }


        .search input {

            flex: 1;

            height: 42px;

            padding: 0 14px;

            border: 1px solid #333;

            border-radius: 6px;

            outline: none;

            background: #242424;

            color: white;

            font-size: 15px;
        }


        .search input:focus {

            border-color: #666;
        }


        .search input::placeholder {

            color: #999;
        }


        .search button {

            height: 42px;

            padding: 0 22px;

            border: none;

            border-radius: 6px;

            background: #9147ff;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .search button:hover {

            background: #772ce8;
        }


        /* =========================================
           CONTENEDOR
        ========================================= */

        .content {

            width: 100%;

            max-width: 1200px;

            margin: 30px auto;

            padding: 0 20px;
        }


        /* =========================================
           TWITCH + CHAT
        ========================================= */

        .twitch-section {

            display: grid;

            grid-template-columns:
                minmax(0, 900px)
                300px;

            gap: 20px;

            align-items: start;

            justify-content: center;
        }


        /* =========================================
           TWITCH PLAYER
        ========================================= */

        .player {

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: 8px;

            overflow: hidden;
        }


        .player iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;
        }


        /* =========================================
           CHAT
        ========================================= */

        .chat {

            width: 100%;

            height: 506px;

            background: #181818;

            border-radius: 8px;

            overflow: hidden;
        }


        .chat iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;
        }


        /* =========================================
           SEGUNDA PANTALLA
        ========================================= */

        .second-section {

            width: 100%;

            max-width: 900px;

            margin: 35px auto 60px;

            display: block;
        }


        .second-title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 12px;
        }


        .second-screen {

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: 8px;

            overflow: hidden;
        }


        .second-screen iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;
        }


        .second-screen video {

            width: 100%;

            height: 100%;

            display: block;

            background: #000;
        }


        /* =========================================
           CONTROL SEGUNDA PANTALLA
        ========================================= */

        .video-controls {

            width: 100%;

            margin-top: 12px;

            display: flex;

            gap: 10px;
        }


        .video-controls input {

            flex: 1;

            height: 42px;

            padding: 0 14px;

            border: 1px solid #333;

            border-radius: 6px;

            outline: none;

            background: #242424;

            color: white;

            font-size: 15px;
        }


        .video-controls input:focus {

            border-color: #666;
        }


        .video-controls button {

            height: 42px;

            padding: 0 20px;

            border: none;

            border-radius: 6px;

            background: #9147ff;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .video-controls button:hover {

            background: #772ce8;
        }


        /* =========================================
           MENSAJE DE ERROR
        ========================================= */

        .video-error {

            display: none;

            padding: 12px;

            margin-top: 10px;

            background: #241818;

            border-radius: 6px;

            color: #ffb3b3;

            font-size: 14px;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            .twitch-section {

                grid-template-columns: 1fr;

            }


            .chat {

                height: 400px;

            }

        }


        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            .topbar {

                padding: 10px;

            }


            .search {

                flex-direction: column;

            }


            .search button {

                width: 100%;

            }


            .content {

                padding: 0 10px;

                margin-top: 15px;

            }


            .player {

                border-radius: 4px;

            }


            .chat {

                height: 400px;

                border-radius: 4px;

            }


            .video-controls {

                flex-direction: column;

            }


            .video-controls button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         TWITCH
    ========================================= -->

    <header class="topbar">

        <div class="search">

            <input
                id="twitchUrl"
                type="text"
                placeholder="Pega aquí el link de Twitch..."
                autocomplete="off"
            >

            <button onclick="cargarTwitch()">
                CARGAR
            </button>

        </div>

    </header>


    <!-- =========================================
         CONTENIDO
    ========================================= -->

    <main class="content">


        <!-- =====================================
             TWITCH + CHAT
        ===================================== -->

        <section class="twitch-section">


            <!-- TWITCH -->

            <div class="player">

                <iframe
                    id="twitchPlayer"

                    allow="fullscreen; picture-in-picture"

                    allowfullscreen

                    title="Twitch Player">
                </iframe>

            </div>


            <!-- CHAT -->

            <div class="chat">

                <iframe
                    id="twitchChat"

                    title="Twitch Chat">
                </iframe>

            </div>


        </section>


        <!-- =====================================
             SEGUNDA PANTALLA
        ===================================== -->

        <section
            class="second-section"
            id="secondSection"
        >


            <div class="second-title">
                Segunda pantalla
            </div>


            <div
                class="second-screen"
                id="secondScreen"
            >

                <!-- Aquí aparecerá el segundo vídeo -->

            </div>


            <div class="video-controls">

                <input
                    id="videoUrl"

                    type="text"

                    placeholder="Pega aquí el link del segundo vídeo..."

                    autocomplete="off"
                >


                <button onclick="cargarSegundoVideo()">
                    CARGAR
                </button>

            </div>


            <div
                class="video-error"
                id="videoError"
            >
                No se pudo reproducir esta URL.
            </div>


        </section>


    </main>


    <script>


        /* =========================================
           TWITCH
        ========================================= */


        function obtenerCanal(url) {

            url = url.trim();


            if (!url) {

                return null;

            }


            if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
            ) {

                url = "https://" + url;

            }


            try {

                const direccion = new URL(url);


                if (
                    !direccion.hostname
                        .toLowerCase()
                        .includes("twitch.tv")
                ) {

                    return null;

                }


                let canal =
                    direccion.pathname
                        .replace(/^\/+/, "")
                        .replace(/\/+$/, "");


                if (!canal) {

                    return null;

                }


                return canal.split("/")[0];

            }


            catch (error) {

                return null;

            }

        }


        /* =========================================
           CARGAR TWITCH
        ========================================= */


        function cargarTwitch() {

            const input =
                document.getElementById("twitchUrl");


            const canal =
                obtenerCanal(input.value);


            if (!canal) {

                alert(
                    "Introduce un enlace válido de Twitch.\n\n" +
                    "Ejemplo:\n" +
                    "https://www.twitch.tv/nombrecanal"
                );

                return;

            }


            const parent =
                window.location.hostname;


            /* =====================================
               PLAYER TWITCH
            ===================================== */

            const player =
                document.getElementById("twitchPlayer");


            player.src =
                "https://player.twitch.tv/" +
                "?channel=" +
                encodeURIComponent(canal) +
                "&parent=" +
                encodeURIComponent(parent) +
                "&autoplay=false" +
                "&muted=true";


            /* =====================================
               CHAT TWITCH
            ===================================== */

            const chat =
                document.getElementById("twitchChat");


            chat.src =
                "https://www.twitch.tv/embed/" +
                encodeURIComponent(canal) +
                "/chat" +
                "?parent=" +
                encodeURIComponent(parent);

        }


        /* =========================================
           YOUTUBE
        ========================================= */


        function obtenerYoutubeId(url) {

            try {

                const direccion =
                    new URL(url);


                /* youtube.com/watch?v= */

                if (
                    direccion.hostname
                        .toLowerCase()
                        .includes("youtube.com") &&

                    direccion.searchParams.get("v")
                ) {

                    return direccion.searchParams.get("v");

                }


                /* youtu.be/ID */

                if (
                    direccion.hostname
                        .toLowerCase() === "youtu.be"
                ) {

                    return direccion.pathname
                        .replace("/", "")
                        .split("?")[0];

                }


                /* youtube.com/shorts/ID */

                if (
                    direccion.pathname
                        .startsWith("/shorts/")
                ) {

                    return direccion.pathname
                        .split("/")[2];

                }


                /* youtube.com/live/ID */

                if (
                    direccion.pathname
                        .startsWith("/live/")
                ) {

                    return direccion.pathname
                        .split("/")[2];

                }


                return null;

            }


            catch (error) {

                return null;

            }

        }


        /* =========================================
           CARGAR SEGUNDO VÍDEO
        ========================================= */


        function cargarSegundoVideo() {


            const input =
                document.getElementById("videoUrl");


            const url =
                input.value.trim();


            const pantalla =
                document.getElementById("secondScreen");


            const error =
                document.getElementById("videoError");


            if (!url) {

                return;

            }


            pantalla.innerHTML = "";

            error.style.display = "none";


            /* =====================================
               YOUTUBE
            ===================================== */

            const youtubeId =
                obtenerYoutubeId(url);


            if (youtubeId) {


                const iframe =
                    document.createElement("iframe");


                iframe.src =
                    "https://www.youtube.com/embed/" +

                    encodeURIComponent(youtubeId);


                iframe.allow =
                    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


                iframe.allowFullscreen = true;


                iframe.title =
                    "Vídeo de YouTube";


                pantalla.appendChild(iframe);


                return;

            }


            /* =====================================
               MP4 / WEBM / OGG
            ===================================== */

            const urlSinQuery =
                url
                    .split("?")[0]
                    .toLowerCase();


            const esVideoDirecto =

                urlSinQuery.endsWith(".mp4") ||

                urlSinQuery.endsWith(".webm") ||

                urlSinQuery.endsWith(".ogg") ||

                urlSinQuery.endsWith(".mov");


            if (esVideoDirecto) {


                const video =
                    document.createElement("video");


                video.src = url;


                video.controls = true;


                video.playsInline = true;


                video.preload = "metadata";


                pantalla.appendChild(video);


                return;

            }


            /* =====================================
               M3U8 / HLS
            ===================================== */

            if (
                urlSinQuery.includes(".m3u8")
            ) {


                const video =
                    document.createElement("video");


                video.controls = true;


                video.playsInline = true;


                video.preload = "metadata";


                pantalla.appendChild(video);


                if (
                    window.Hls &&
                    Hls.isSupported()
                ) {


                    const hls =
                        new Hls();


                    hls.loadSource(url);


                    hls.attachMedia(video);


                    return;

                }


                if (
                    video.canPlayType(
                        "application/vnd.apple.mpegurl"
                    )
                ) {

                    video.src = url;

                    return;

                }


                mostrarError(
                    "Este navegador no puede reproducir directamente esta señal HLS."
                );


                return;

            }


            /* =====================================
               ÚLTIMO INTENTO:
               IFRAME
            ===================================== */

            const iframe =
                document.createElement("iframe");


            iframe.src = url;


            iframe.allowFullscreen = true;


            iframe.allow =
                "autoplay; fullscreen; picture-in-picture";


            iframe.title =
                "Segunda fuente";


            pantalla.appendChild(iframe);


            /*
             * Algunas plataformas permiten
             * incrustar directamente su página.
             *
             * Si la plataforma bloquea iframe,
             * el navegador impedirá mostrarla.
             */


        }


        /* =========================================
           ERROR SEGUNDA PANTALLA
        ========================================= */


        function mostrarError(mensaje) {

            const error =
                document.getElementById("videoError");


            error.textContent =
                mensaje;
            
            error.style.display =
                "block";
        }

        /* =========================================
           ENTER TWITCH
        ========================================= */
        document
            .getElementById("twitchUrl")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {
                        cargarTwitch();
                    }
                }
            );
        /* =========================================
           ENTER SEGUNDO VÍDEO
        ========================================= */
        document
            .getElementById("videoUrl")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {
                        cargarSegundoVideo();
                    }
                }
            );

    </script>
</body>
</html>
