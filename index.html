<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Transmisión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .topbar {
            width: 100%;
            background: #18181b;
            padding: 10px 18px;
            border-bottom: 1px solid #303033;
            flex-shrink: 0;
        }

        .search {
            width: 100%;
            margin: auto;
            display: flex;
            gap: 10px;
            padding: 0 10px;
        }

        .search input {
            flex: 1;
            height: 38px;
            padding: 0 14px;
            border: 1px solid #3a3a3d;
            border-radius: 6px;
            outline: none;
            background: #1f1f23;
            color: white;
            font-size: 14px;
        }

        .search input:focus {
            border-color: #9147ff;
        }

        .search input::placeholder {
            color: #aaa;
        }

        .search button {
            height: 38px;
            padding: 0 20px;
            border: none;
            border-radius: 6px;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .search button:hover {
            background: #772ce8;
        }

        .btn-espejo {
            height: 38px;
            padding: 0 16px;
            border: none;
            border-radius: 6px;
            background: #00e676;
            color: black;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-espejo:hover {
            background: #00c853;
        }

        .layout {
            flex: 1;
            width: 100%;
            margin: 0;
            padding: 16px;
            display: flex;
            min-height: 0;
        }

        .stream-layout {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(320px, 1fr) minmax(0, 2.2fr) minmax(300px, 1fr);
            gap: 16px;
            align-items: stretch;
            height: 100%;
        }

        .sidebar-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;
            overflow-y: auto;
        }

        .recommended-section {
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .streamer-widget-content {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }

        .streamer-widget {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 15;
            background: #0e0e10;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        #twitchPlayer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #twitchPlayer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .donation-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 8px;
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .donation-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 2px;
            background: #1f1f23;
            border: 1px solid #3a3a3d;
            border-radius: 5px;
            color: #efeff1;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }

        .donation-btn i {
            font-size: 16px;
        }

        .donation-btn:hover {
            background: #2d2d30;
            border-color: #9147ff;
        }

        .stream-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            height: 34px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-play {
            background: #9147ff;
            color: white;
        }

        .btn-play:hover {
            background: #772ce8;
        }

        .ctrl-btn.btn-recargar {
            background: #ff9800;
            color: black;
        }

        .ctrl-btn.btn-recargar:hover {
            background: #f57c00;
        }

        .playlist-box {
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .playlist-title {
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 180px;
            overflow-y: auto;
        }

        .playlist-item {
            background: #1f1f23;
            border: 1px solid #3a3a3d;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .playlist-item:hover {
            background: #2d2d30;
            border-color: #9147ff;
        }

        .playlist-item.active {
            border-color: #9147ff;
            background: #2c1f4a;
        }

        .center-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;
        }

        .video-area {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #303033;
            min-height: 0;
        }

        #secondScreen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #secondScreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #secondScreen video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="search">
            <input type="text" id="urlInput" placeholder="Pega un enlace de Kick, YouTube o Twitch aquí...">
            <button onclick="cargarContenidoCentral()">Cargar Contenido</button>
            <button class="btn-espejo" onclick="recargarPantallaCentral()">Recargar Tele</button>
        </div>
    </div>

    <div class="layout">
        <div class="stream-layout">
            
            <!-- COLUMNA IZQUIERDA: Tu reproductor fijo de Twitch principal -->
            <div class="sidebar-left">
                <div class="recommended-section">
                    <div class="streamer-widget-content">
                        <div class="streamer-widget">
                            <div id="twitchPlayer">
                                <!-- Reemplaza TU_CANAL_PRINCIPAL por tu nombre de usuario exacto de Twitch -->
                                <iframe 
                                    src="https://twitch.tv" 
                                    allowfullscreen="true" 
                                    scrolling="no">
                                </iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMNA CENTRAL: Pantalla Variable (Kick / YouTube / Twitch Opcional) -->
            <div class="center-area">
                <div class="video-area">
                    <div id="secondScreen">
                        <div class="empty-message">Introduce un enlace arriba para iniciar la transmisión</div>
                    </div>
                </div>
            </div>
