<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portal de Reacción</title>


    <!-- Twitch Embed Player SDK -->
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>


    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #0f0f0f;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            min-height: 100vh;

        }


        /* =========================================
           BARRA SUPERIOR
        ========================================== */

        .topbar {

            width: 100%;

            background: #181818;

            padding: 14px 20px;

            display: flex;

            justify-content: center;

            position: relative;

            z-index: 1000;

        }


        .search {

            width: 100%;

            max-width: 1100px;

            display: flex;

            gap: 10px;

        }


        .search input {

            flex: 1;

            height: 42px;

            padding: 0 14px;

            border: 1px solid #333;

            border-radius: 6px;

            outline: none;

            background: #242424;

            color: white;

            font-size: 15px;

        }


        .search input:focus {

            border-color: #666;

        }


        .search input::placeholder {

            color: #999;

        }


        .search button {

            height: 42px;

            padding: 0 22px;

            border: none;

            border-radius: 6px;

            background: #9147ff;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .search button:hover {

            background: #772ce8;

        }


        /* =========================================
           SEGUNDO VIDEO
           ESTE ES EL FONDO PRINCIPAL
        ========================================== */

        .main-area {

            width: 100%;

            padding: 30px 20px 60px;

            display: flex;

            justify-content: center;

        }


        .video-container {

            position: relative;

            width: 100%;

            max-width: 1200px;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: 8px;

            overflow: hidden;

        }


        /* =========================================
           SEGUNDO VIDEO
        ========================================== */

        #secondScreen {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            background: #000;

        }


        #secondScreen iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;

        }


        #secondScreen video {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: contain;

            background: #000;

        }


        /* =========================================
           VENTANA TWITCH
        ========================================== */

        #twitchWindow {

            position: absolute;

            left: 25px;

            bottom: 25px;

            width: 320px;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: 8px;

            overflow: hidden;

            z-index: 20;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.6);

        }


        #twitchPlayer {

            width: 100%;

            height: 100%;

        }


        /* =========================================
           MENSAJE INICIAL
        ========================================== */

        .empty-message {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #777;

            font-size: 16px;

            pointer-events: none;

        }


        /* =========================================
           CONTROLES DEL SEGUNDO VIDEO
        ========================================== */

        .video-input {

            width: 100%;

            max-width: 1200px;

            margin-top: 15px;

            display: flex;

            gap: 10px;

        }


        .video-input input {

            flex: 1;

            height: 42px;

            padding: 0 14px;

            border: 1px solid #333;

            border-radius: 6px;

            outline: none;

            background: #242424;

            color: white;

            font-size: 15px;

        }


        .video-input input:focus {

            border-color: #666;

        }


        .video-input input::placeholder {

            color: #999;

        }


        .video-input button {

            height: 42px;

            padding: 0 22px;

            border: none;

            border-radius: 6px;

            background: #9147ff;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .video-input button:hover {

            background: #772ce8;

        }


        /* =========================================
           ERROR
        ========================================== */

        .error {

            display: none;

            margin-top: 10px;

            padding: 10px;

            background: #2a1717;

            border-radius: 6px;

            color: #ffaaaa;

            font-size: 14px;

        }


        /* =========================================
           TABLET
        ========================================== */

        @media (max-width: 900px) {

            .video-container {

                border-radius: 6px;

            }


            #twitchWindow {

                width: 260px;

                left: 18px;

                bottom: 18px;

            }

        }


        /* =========================================
           CELULAR
        ========================================== */

        @media (max-width: 600px) {

            .topbar {

                padding: 10px;

            }


            .search {

                flex-direction: column;

            }


            .search button {

                width: 100%;

            }


            .main-area {

                padding:
                    15px
                    10px
                    40px;

            }


            .video-container {

                border-radius: 4px;

            }


            #twitchWindow {

                width: 180px;

                left: 10px;

                bottom: 10px;

                border-radius: 5px;

            }


            .video-input {

                flex-direction: column;

            }


            .video-input button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         BARRA TWITCH
    ========================================== -->

    <header class="topbar">

        <div class="search">

            <input
                id="twitchUrl"
                type="text"
                placeholder="Pega aquí el link de Twitch..."
                autocomplete="off"
            >

            <button onclick="cargarTwitch()">
                CARGAR TWITCH
            </button>

        </div>

    </header>


    <!-- =========================================
         ÁREA PRINCIPAL
    ========================================== -->

    <main class="main-area">

        <div style="width: 100%; max-width: 1200px;">


            <!-- =====================================
                 VIDEO PRINCIPAL + TWITCH ENCIMA
            ===================================== -->

            <div class="video-container">


                <!-- SEGUNDO VIDEO -->

                <div id="secondScreen">

                    <div class="empty-message">
                        Pega abajo el link del vídeo que quieras mostrar
                    </div>

                </div>


                <!-- TWITCH FLOTANTE -->

                <div id="twitchWindow">

                    <div id="twitchPlayer"></div>

                </div>


            </div>


            <!-- =====================================
                 LINK DEL SEGUNDO VIDEO
            ===================================== -->

            <div class="video-input">

                <input
                    id="videoUrl"
                    type="text"
                    placeholder="Pega aquí el link del segundo vídeo..."
                    autocomplete="off"
                >

                <button onclick="cargarSegundoVideo()">
                    CARGAR VIDEO
                </button>

            </div>


            <div
                id="videoError"
                class="error">
            </div>


        </div>

    </main>


    <script>


        /* =========================================
           TWITCH
        ========================================== */

        let twitchPlayer = null;


        /* =========================================
           OBTENER CANAL
        ========================================== */

        function obtenerCanal(url) {

            url = url.trim();


            if (!url) {

                return null;

            }


            if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
            ) {

                url =
                    "https://" + url;

            }


            try {

                const direccion =
                    new URL(url);


                if (
                    !direccion.hostname
                        .toLowerCase()
                        .includes("twitch.tv")
                ) {

                    return null;

                }


                const partes =
                    direccion.pathname
                        .replace(/^\/+/, "")
                        .replace(/\/+$/, "")
                        .split("/");


                if (!partes[0]) {

                    return null;

                }


                return partes[0];

            }

            catch (error) {

                return null;

            }

        }


        /* =========================================
           CARGAR TWITCH
        ========================================== */

        function cargarTwitch() {

            const input =
                document.getElementById(
                    "twitchUrl"
                );


            const canal =
                obtenerCanal(
                    input.value
                );


            if (!canal) {

                alert(
                    "Introduce un link válido de Twitch."
                );

                return;

            }


            const parent =
                window.location.hostname;


            const contenedor =
                document.getElementById(
                    "twitchPlayer"
                );


            contenedor.innerHTML = "";


            /*
             * Creamos el reproductor oficial
             * de Twitch.
             */

            twitchPlayer =
                new Twitch.Player(
                    "twitchPlayer",
                    {

                        width: "100%",

                        height: "100%",

                        channel: canal,

                        parent: [
                            parent
                        ],

                        autoplay: false,

                        muted: false

                    }
                );


            twitchPlayer.addEventListener(
                Twitch.Player.READY,
                function() {

                    console.log(
                        "Twitch Player listo."
                    );

                }
            );

        }


        /* =========================================
           YOUTUBE ID
        ========================================== */

        function obtenerYoutubeId(url) {

            try {

                const direccion =
                    new URL(url);


                const hostname =
                    direccion.hostname
                        .toLowerCase();


                /*
                 * youtube.com/watch?v=
                 */

                if (
                    hostname.includes(
                        "youtube.com"
                    )
                ) {

                    const id =
                        direccion.searchParams
                            .get("v");


                    if (id) {

                        return id;

                    }

                }


                /*
                 * youtu.be/ID
                 */

                if (
                    hostname === "youtu.be"
                ) {

                    return direccion
                        .pathname
                        .replace(/^\/+/, "")
                        .split("/")[0];

                }


                /*
                 * youtube.com/live/ID
                 */

                if (
                    direccion.pathname
                        .startsWith("/live/")
                ) {

                    return direccion.pathname
                        .split("/")[2];

                }


                /*
                 * youtube.com/shorts/ID
                 */

                if (
                    direccion.pathname
                        .startsWith("/shorts/")
                ) {

                    return direccion.pathname
                        .split("/")[2];

                }


                return null;

            }

            catch (error) {

                return null;

            }

        }


        /* =========================================
           ERROR
        ========================================== */

        function mostrarError(texto) {

            const error =
                document.getElementById(
                    "videoError"
                );


            error.textContent =
                texto;


            error.style.display =
                "block";

        }


        /* =========================================
           SEGUNDO VIDEO
        ========================================== */

        function cargarSegundoVideo() {

            const input =
                document.getElementById(
                    "videoUrl"
                );


            const url =
                input.value.trim();


            const pantalla =
                document.getElementById(
                    "secondScreen"
                );


            const error =
                document.getElementById(
                    "videoError"
                );


            if (!url) {

                return;

            }


            pantalla.innerHTML = "";


            error.style.display =
                "none";


            /* =====================================
               YOUTUBE
            ===================================== */

            const youtubeId =
                obtenerYoutubeId(url);


            if (youtubeId) {

                const iframe =
                    document.createElement(
                        "iframe"
                    );


                iframe.src =
                    "https://www.youtube.com/embed/" +
                    encodeURIComponent(
                        youtubeId
                    ) +
                    "?autoplay=0";


                iframe.allow =
                    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


                iframe.allowFullscreen =
                    true;


                iframe.title =
                    "Vídeo de YouTube";


                pantalla.appendChild(
                    iframe
                );


                return;

            }


            /* =====================================
               MP4 / WEBM / OGG / MOV
            ===================================== */

            const urlSinQuery =
                url
                    .split("?")[0]
                    .toLowerCase();


            const esVideoDirecto =

                urlSinQuery.endsWith(".mp4") ||
                urlSinQuery.endsWith(".webm") ||
                urlSinQuery.endsWith(".ogg") ||
                urlSinQuery.endsWith(".mov");


            if (esVideoDirecto) {

                const video =
                    document.createElement(
                        "video"
                    );


                video.src =
                    url;


                video.controls =
                    true;


                video.playsInline =
                    true;


                video.preload =
                    "metadata";


                pantalla.appendChild(
                    video
                );


                return;

            }


            /* =====================================
               HLS .M3U8
            ===================================== */

            if (
                urlSinQuery.includes(
                    ".m3u8"
                )
            ) {

                const video =
                    document.createElement(
                        "video"
                    );


                video.controls =
                    true;


                video.playsInline =
                    true;


                video.preload =
                    "metadata";


                pantalla.appendChild(
                    video
                );


                if (
                    window.Hls &&
                    Hls.isSupported()
                ) {

                    const hls =
                        new Hls();


                    hls.loadSource(
                        url
                    );


                    hls.attachMedia(
                        video
                    );


                    hls.on(
                        Hls.Events.ERROR,
                        function(
                            event,
                            data
                        ) {

                            if (
                                data.fatal
                            ) {

                                mostrarError(
                                    "No se pudo reproducir el stream HLS."
                                );

                            }

                        }
                    );


                    return;

                }


                if (
                    video.canPlayType(
                        "application/vnd.apple.mpegurl"
                    )
                ) {

                    video.src =
                        url;

                    return;

                }


                mostrarError(
                    "Tu navegador no puede reproducir este stream HLS."
                );


                return;

            }


            /* =====================================
               ÚLTIMO INTENTO
               COMO IFRAME
            ===================================== */

            const iframe =
                document.createElement(
                    "iframe"
                );


            iframe.src =
                url;


            iframe.allow =
                "autoplay; fullscreen; picture-in-picture";


            iframe.allowFullscreen =
                true;


            iframe.title =
                "Segundo vídeo";


            pantalla.appendChild(
                iframe
            );

        }


        /* =========================================
           ENTER TWITCH
        ========================================== */

        document
            .getElementById(
                "twitchUrl"
            )
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        cargarTwitch();

                    }

                }
            );


        /* =========================================
           ENTER SEGUNDO VIDEO
        ========================================== */

        document
            .getElementById(
                "videoUrl"
            )
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        cargarSegundoVideo();

                    }

                }
            );


    </script>


</body>

</html>
