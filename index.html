<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Transmisión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .topbar {
            width: 100%;
            background: #18181b;
            padding: 10px 18px;
            border-bottom: 1px solid #303033;
            flex-shrink: 0;
        }

        .search {
            width: 100%;
            margin: auto;
            display: flex;
            gap: 10px;
            padding: 0 10px;
        }

        .search input {
            flex: 1;
            height: 38px;
            padding: 0 14px;
            border: 1px solid #3a3a3d;
            border-radius: 6px;
            outline: none;
            background: #1f1f23;
            color: white;
            font-size: 14px;
        }

        .search input:focus {
            border-color: #9147ff;
        }

        .search input::placeholder {
            color: #aaa;
        }

        .search button {
            height: 38px;
            padding: 0 20px;
            border: none;
            border-radius: 6px;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .search button:hover {
            background: #772ce8;
        }

        .btn-espejo {
            height: 38px;
            padding: 0 16px;
            border: none;
            border-radius: 6px;
            background: #00e676;
            color: black;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-espejo:hover {
            background: #00c853;
        }

        .layout {
            flex: 1;
            width: 100%;
            margin: 0;
            padding: 16px;
            display: flex;
            min-height: 0;
        }

        .stream-layout {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(320px, 1fr) minmax(0, 2.2fr) minmax(300px, 1fr);
            gap: 16px;
            align-items: stretch;
            height: 100%;
        }

        .sidebar-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;
            overflow-y: auto;
        }

        .recommended-section {
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .streamer-widget-content {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }

        .streamer-widget {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 15;
            background: #0e0e10;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        #twitchPlayer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #twitchPlayer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .donation-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 8px;
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .donation-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 2px;
            background: #1f1f23;
            border: 1px solid #3a3a3d;
            border-radius: 5px;
            color: #efeff1;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }

        .donation-btn i {
            font-size: 16px;
        }

        .donation-btn:hover {
            background: #2d2d30;
            border-color: #9147ff;
        }

        .stream-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            height: 34px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-play {
            background: #9147ff;
            color: white;
        }

        .btn-play:hover {
            background: #772ce8;
        }

        .ctrl-btn.btn-recargar {
            background: #ff9800;
            color: black;
        }

        .ctrl-btn.btn-recargar:hover {
            background: #f57c00;
        }

        /* Estilos de la Playlist */
        .playlist-box {
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .playlist-title {
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 180px;
            overflow-y: auto;
        }

        .playlist-item {
            background: #1f1f23;
            border: 1px solid #3a3a3d;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .playlist-item:hover {
            background: #2d2d30;
            border-color: #9147ff;
        }

        .playlist-item.active {
            border-color: #9147ff;
            background: #2c1f4a;
        }

        .center-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;
        }

        .video-area {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #303033;
            min-height: 0;
        }

        #secondScreen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #secondScreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #secondScreen video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 15px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .video-input {
            width: 100%;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .video-input input {
            flex: 1;
            height: 38px;
            padding: 0 14px;
            border: 1px solid #3a3a3d;
            border-radius: 6px;
            outline: none;
            background: #1f1f23;
            color: white;
            font-size: 14px;
        }

        .video-input input:focus {
            border-color: #9147ff;
        }

        .video-input button {
            height: 38px;
            padding: 0 16px;
            border: none;
            border-radius: 6px;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .video-input button:hover {
            background: #772ce8;
        }

        .btn-capturar {
            background: #ff4757 !important;
        }

        .btn-capturar:hover {
            background: #ff6b81 !important;
        }

        .chat-area {
            width: 100%;
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .chat-header {
            height: 38px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px solid #303033;
        }

        .chat-frame {
            flex: 1;
            min-height: 0;
        }

        .chat-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .error {
            display: none;
            margin-top: 5px;
            padding: 8px;
            border-radius: 6px;
            background: #2a1717;
            color: #ffaaaa;
            font-size: 13px;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="search">
            <input id="twitchUrl" type="text" placeholder="Pega aquí el link de Twitch de la streamer..." autocomplete="off">
            <button onclick="cargarTwitch()">CARGAR STREAMER</button>
            <button class="btn-espejo" onclick="abrirEspejo()">🔗 Abrir Espejo</button>
        </div>
    </header>

    <main class="layout">
        <div class="stream-layout">
            <aside class="sidebar-left">
                <div class="recommended-section">
                    <div class="streamer-widget-content">
                        <div class="streamer-widget">
                            <div id="twitchPlayer">
                                <div class="empty-message" style="background:#0e0e10;">Sin canal cargado</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="donation-links">
                    <a href="https://ko-fi.com/cotecreator/shop" target="_blank" class="donation-btn" title="Ko-fi">
                        <i class="fa-solid fa-mug-hot" style="color: #29abe0;"></i>
                        Ko-fi
                    </a>
                    <a href="https://ceneka.net/coteparrague" target="_blank" class="donation-btn" title="Ceneka">
                        <i class="fa-solid fa-heart" style="color: #ff4757;"></i>
                        Ceneka
                    </a>
                    <a href="https://streamelements.com/coteparrague/tip" target="_blank" class="donation-btn" title="Tips">
                        <i class="fa-solid fa-hand-holding-dollar" style="color: #2ed573;"></i>
                        Tips
                    </a>
                </div>

                <div class="stream-controls">
                    <button class="ctrl-btn btn-play" onclick="forzarPlayTwitch()"><i class="fa-solid fa-play"></i> Play</button>
                    <button class="ctrl-btn btn-recargar" onclick="recargarStreamer()"><i class="fa-solid fa-rotate"></i> Recargar</button>
                </div>

                <!-- PLAYLIST DE GOOGLE DRIVE O VIDEOS -->
                <div class="playlist-box">
                    <div class="playlist-title">
                        <span>PLAYLIST DE VIDEOS</span>
                        <i class="fa-solid fa-list"></i>
                    </div>
                    <div class="playlist-items" id="playlistContainer">
                        <!-- Los videos se cargan automáticamente aquí -->
                    </div>
                </div>
            </aside>

            <section class="center-area">
                <div class="video-area">
                    <div id="secondScreen">
                        <div class="empty-message">
                            Selecciona de la playlist o pega abajo un link
                        </div>
                    </div>
                </div>

                <div class="video-input">
                    <input id="videoUrl" type="text" placeholder="Pega link o usa el botón de captura..." autocomplete="off">
                    <button onclick="cargarSegundoVideo()">CARGAR VIDEO</button>
                    <button class="btn-capturar" onclick="capturarPantallaWeb()" title="Capturar pestaña o ventana"><i class="fa-solid fa-desktop"></i> Capturar</button>
                </div>
                <div id="videoError" class="error"></div>
            </section>

            <aside class="chat-area">
                <div class="chat-header">
                    Chat del stream
                </div>
                <div class="chat-frame">
                    <iframe id="twitchChat" title="Chat de Twitch"></iframe>
                </div>
            </aside>
        </div>
    </main>

    <script>
        // LISTA DE REPRODUCCIÓN (10 VIDEOS DE DRIVE)
        const playlistVideos = [
            { titulo: "Video 1", url: "https://drive.google.com/file/d/1nhQaS8svuzhzxlkSVKRVJdfCx-4cWf9M/view?usp=drive_link" },
            { titulo: "Video 2", url: "https://drive.google.com/file/d/1ahvzENOnWvztI4N2uDQlw8bJ3stn0Hdf/view?usp=drive_link" },
            { titulo: "Video 3", url: "https://drive.google.com/file/d/1j4QA5zl5T8VvPvVwIv6hYUSjSeykJJxi/view?usp=drive_link" },
            { titulo: "Video 4", url: "https://drive.google.com/file/d/1cOAof_kugoieeCLsek6CTyUPLvcxXeRD/view?usp=drive_link" },
            { titulo: "Video 5", url: "https://drive.google.com/file/d/1U805GOViwiJv34NRu7aor3_5OdUfcz5p/view?usp=drive_link" },
            { titulo: "Video 6", url: "https://drive.google.com/file/d/1tUumNkdaELFwlhNr499MDLJ1e2LmZg13/view?usp=drive_link" },
            { titulo: "Video 7", url: "https://drive.google.com/file/d/1rIsgNjsMvl3lPjEkDM9Q9fXZtNzipW3X/view?usp=drive_link" },
            { titulo: "Video 8", url: "https://drive.google.com/file/d/1imcI6s7os1QUpI8ls1LJcnVxedj1fhr_/view?usp=drive_link" },
            { titulo: "Video 9", url: "https://drive.google.com/file/d/1CLq3L3XvXNWtVqjLBj-oY9xJxF8qGqTy/view?usp=drive_link" },
            { titulo: "Video 10", url: "https://drive.google.com/file/d/1VnYYip4QPOQS--8agpXX1d0TMegqAN2b/view?usp=drive_link" }
        ];

        function inicializarPlaylist() {
            const contenedor = document.getElementById("playlistContainer");
            contenedor.innerHTML = "";
            playlistVideos.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "playlist-item";
                div.innerHTML = `<span>${item.titulo}</span> <i class="fa-solid fa-play"></i>`;
                div.onclick = () => reproducirDesdePlaylist(index);
                contenedor.appendChild(div);
            });
        }

        function reproducirDesdePlaylist(index) {
            const videoObj = playlistVideos[index];
            const input = document.getElementById("videoUrl");
            input.value = videoObj.url;
            
            document.querySelectorAll(".playlist-item").forEach((el, idx) => {
                if (idx === index) el.classList.add("active");
                else el.classList.remove("active");
            });

            cargarSegundoVideo();
        }

        function guardarDatosSesion(twitchUrl, videoUrl) {
            localStorage.setItem("twitchUrl", twitchUrl);
            localStorage.setItem("videoUrl", videoUrl);
        }

        function abrirEspejo() {
            const twitchUrl = document.getElementById("twitchUrl").value.trim();
            const videoUrl = document.getElementById("videoUrl").value.trim();
            guardarDatosSesion(twitchUrl, videoUrl);
            window.open("espejo.html", "_blank");
        }

        function obtenerCanal(url) {
            url = url.trim();
            if (!url) return null;
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }
            try {
                const direccion = new URL(url);
                if (!direccion.hostname.toLowerCase().includes("twitch.tv")) return null;
                const partes = direccion.pathname.replace(/^\/+/, "").replace(/\/+$/, "").split("/");
                return partes[0] || null;
            } catch (error) {
                return null;
            }
        }

        function cargarTwitch() {
            const input = document.getElementById("twitchUrl");
            const urlVal = input.value.trim();
            const canal = obtenerCanal(urlVal);

            if (!canal) {
                alert("Introduce un link válido de Twitch.");
                return;
            }

            const videoUrl = document.getElementById("videoUrl").value.trim();
            guardarDatosSesion(urlVal, videoUrl);

            const parent = window.location.hostname || "localhost";
            const playerDiv = document.getElementById("twitchPlayer");
            playerDiv.innerHTML = "";

            const iframe = document.createElement("iframe");
            iframe.src = `https://player.twitch.tv/?channel=${encodeURIComponent(canal)}&parent=${encodeURIComponent(parent)}&muted=true&autoplay=true`;
            iframe.allowFullscreen = true;
            iframe.allow = "autoplay; encrypted-media; fullscreen";
            playerDiv.appendChild(iframe);

            const chat = document.getElementById("twitchChat");
            chat.src = "https://www.twitch.tv/embed/" + encodeURIComponent(canal) + "/chat?parent=" + encodeURIComponent(parent);
        }

        function recargarStreamer() {
            const input = document.getElementById("twitchUrl");
            if (input.value.trim()) {
                cargarTwitch();
            }
        }

        function forzarPlayTwitch() {
            const input = document.getElementById("twitchUrl");
            if (input.value.trim()) {
                cargarTwitch();
            }
        }

        async function capturarPantallaWeb() {
            const pantalla = document.getElementById("secondScreen");
            const error = document.getElementById("videoError");
            error.style.display = "none";

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });

                pantalla.innerHTML = "";
                const video = document.createElement("video");
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true;
                video.controls = true;
                pantalla.appendChild(video);

                stream.getVideoTracks()[0].onended = () => {
                    pantalla.innerHTML = `<div class="empty-message">Captura finalizada</div>`;
                };

            } catch (err) {
                console.error("Error al capturar pantalla:", err);
            }
        }

        function obtenerYoutubeId(url) {
            try {
                const direccion = new URL(url);
                const hostname = direccion.hostname.toLowerCase();
                if (hostname.includes("youtube.com")) {
                    const id = direccion.searchParams.get("v");
                    if (id) return id;
                }
                if (hostname === "youtu.be") {
                    return direccion.pathname.replace(/^\/+/, "").split("/")[0];
                }
                if (direccion.pathname.startsWith("/live/") || direccion.pathname.startsWith("/shorts/")) {
                    return direccion.pathname.split("/")[2];
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        function convertirGoogleDrive(url) {
            try {
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    const fileId = match[1];
                    return `https://drive.google.com/file/d/${fileId}/preview`;
                }
            } catch (e) {
                console.error("Error procesando link de Drive", e);
            }
            return null;
        }

        function cargarSegundoVideo() {
            const input = document.getElementById("videoUrl");
            let url = input.value.trim();
            const pantalla = document.getElementById("secondScreen");
            const error = document.getElementById("videoError");

            if (!url) return;

            const twitchUrl = document.getElementById("twitchUrl").value.trim();
            guardarDatosSesion(twitchUrl, url);

            pantalla.innerHTML = "";
            error.style.display = "none";

            if (url.toLowerCase().startsWith("<iframe")) {
                pantalla.innerHTML = url;
                const iframeElement = pantalla.querySelector("iframe");
                if (iframeElement) {
                    iframeElement.style.width = "100%";
                    iframeElement.style.height = "100%";
                    iframeElement.style.border = "none";
                }
                return;
            }

            const youtubeId = obtenerYoutubeId(url);
            if (youtubeId) {
                const iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(youtubeId) + "?autoplay=1";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;
                iframe.title = "Vídeo de YouTube";
                pantalla.appendChild(iframe);
                return;
            }

            const linkDrivePreview = convertirGoogleDrive(url);
            if (linkDrivePreview) {
                const iframe = document.createElement("iframe");
                iframe.src = linkDrivePreview;
                iframe.allow = "autoplay; fullscreen; picture-in-picture";
                iframe.allowFullscreen = true;
                iframe.title = "Reproductor de Google Drive";
                pantalla.appendChild(iframe);
                return;
            }

            const urlSinQuery = url.split("?")[0].toLowerCase();
            const esVideoDirecto = urlSinQuery.endsWith(".mp4") || urlSinQuery.endsWith(".webm") || urlSinQuery.endsWith(".ogg") || urlSinQuery.endsWith(".mov");

            if (esVideoDirecto) {
                const video = document.createElement("video");
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                video.preload = "metadata";
                pantalla.appendChild(video);
                return;
            }

            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            iframe.title = "Transmisión principal";
            pantalla.appendChild(iframe);
        }

        document.getElementById("twitchUrl").addEventListener("keydown", function(event) {
            if (event.key === "Enter") cargarTwitch();
        });

        document.getElementById("videoUrl").addEventListener("keydown", function(event) {
            if (event.key === "Enter") cargarSegundoVideo();
        });

        window.onload = function() {
            inicializarPlaylist();
        };
    </script>

</body>
</html>
