<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Transmisión</title>
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0e0e10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .topbar {
            width: 100%;
            background: #18181b;
            padding: 12px 18px;
            border-bottom: 1px solid #303033;
        }

        .search {
            width: 100%;
            max-width: 1700px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        .search input {
            flex: 1;
            height: 42px;
            padding: 0 14px;
            border: 1px solid #3a3a3d;
            border-radius: 6px;
            outline: none;
            background: #1f1f23;
            color: white;
            font-size: 15px;
        }

        .search input:focus {
            border-color: #9147ff;
        }

        .search input::placeholder {
            color: #aaa;
        }

        .search button {
            height: 42px;
            padding: 0 22px;
            border: none;
            border-radius: 6px;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .search button:hover {
            background: #772ce8;
        }

        .btn-espejo {
            height: 42px;
            padding: 0 18px;
            border: none;
            border-radius: 6px;
            background: #00e676;
            color: black;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-espejo:hover {
            background: #00c853;
        }

        .layout {
            width: 100%;
            max-width: 1700px;
            margin: 20px auto;
            padding: 0 16px;
        }

        /* Reducimos los laterales (240px y 260px) para darle el máximo protagonismo a la columna central (minmax(0, 1fr)) */
        .stream-layout {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr) 280px;
            gap: 16px;
            align-items: start;
        }

        .sidebar-left {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .recommended-section {
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            overflow: hidden;
        }

        .recommended-header {
            padding: 10px 12px;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px solid #303033;
            background: #18181b;
        }

        .streamer-widget {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #twitchPlayer {
            width: 100%;
            height: 100%;
        }

        .center-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-area {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #303033;
        }

        #secondScreen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #secondScreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #secondScreen video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 15px;
            text-align: center;
            padding: 20px;
        }

        .video-input {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .video-input input {
            flex: 1;
            height: 42px;
            padding: 0 14px;
            border: 1px solid #3a3a3d;
            border-radius: 6px;
            outline: none;
            background: #1f1f23;
            color: white;
            font-size: 15px;
        }

        .video-input input:focus {
            border-color: #9147ff;
        }

        .video-input button {
            height: 42px;
            padding: 0 22px;
            border: none;
            border-radius: 6px;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .video-input button:hover {
            background: #772ce8;
        }

        .chat-area {
            width: 100%;
            background: #18181b;
            border: 1px solid #303033;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            min-height: 480px;
        }

        .chat-header {
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px solid #303033;
        }

        .chat-frame {
            flex: 1;
            min-height: 0;
        }

        .chat-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .error {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            background: #2a1717;
            color: #ffaaaa;
            font-size: 14px;
        }

        @media (max-width: 1100px) {
            .stream-layout {
                grid-template-columns: 1fr;
            }
            .chat-area {
                height: 450px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="search">
            <input id="twitchUrl" type="text" placeholder="Pega aquí el link de Twitch de la streamer..." autocomplete="off">
            <button onclick="cargarTwitch()">CARGAR STREAMER</button>
            <button class="btn-espejo" onclick="abrirEspejo()">🔗 Abrir Espejo</button>
        </div>
    </header>

    <main class="layout">
        <div class="stream-layout">
            <!-- Columna Izquierda: Reducida de ancho -->
            <aside class="sidebar-left">
                <div class="recommended-section">
                    <div class="recommended-header">Canales recomendados</div>
                    <div class="streamer-widget">
                        <div id="twitchPlayer"></div>
                        <div id="twitchPlaceholder" class="empty-message" style="background:#111;">Sin canal cargado</div>
                    </div>
                </div>
            </aside>

            <!-- Columna Central: Video Principal con máxima prioridad de espacio -->
            <section class="center-area">
                <div class="video-area">
                    <div id="secondScreen">
                        <div class="empty-message">
                            Pega abajo el link del vídeo principal
                        </div>
                    </div>
                </div>

                <div class="video-input">
                    <input id="videoUrl" type="text" placeholder="Pega aquí el link del vídeo principal..." autocomplete="off">
                    <button onclick="cargarSegundoVideo()">CARGAR VIDEO</button>
                </div>
                <div id="videoError" class="error"></div>
            </section>

            <!-- Columna Derecha: Chat también ajustado -->
            <aside class="chat-area">
                <div class="chat-header">
                    Chat del stream
                </div>
                <div class="chat-frame">
                    <iframe id="twitchChat" title="Chat de Twitch"></iframe>
                </div>
            </aside>
        </div>
    </main>

    <script>
        let twitchPlayer = null;

        function abrirEspejo() {
            const twitchUrl = document.getElementById("twitchUrl").value.trim();
            const videoUrl = document.getElementById("videoUrl").value.trim();
            const urlEspejo = `espejo.html?twitch=${encodeURIComponent(twitchUrl)}&video=${encodeURIComponent(videoUrl)}`;
            window.open(urlEspejo, "_blank");
        }

        function obtenerCanal(url) {
            url = url.trim();
            if (!url) return null;
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }
            try {
                const direccion = new URL(url);
                if (!direccion.hostname.toLowerCase().includes("twitch.tv")) return null;
                const partes = direccion.pathname.replace(/^\/+/, "").replace(/\/+$/, "").split("/");
                return partes[0] || null;
            } catch (error) {
                return null;
            }
        }

        function cargarTwitch() {
            const input = document.getElementById("twitchUrl");
            const canal = obtenerCanal(input.value.trim());

            if (!canal) {
                alert("Introduce un link válido de Twitch.");
                return;
            }

            const parent = window.location.hostname || "localhost";
            const placeholder = document.getElementById("twitchPlaceholder");
            if (placeholder) placeholder.style.display = "none";

            try {
                twitchPlayer = new Twitch.Player("twitchPlayer", {
                    width: "100%",
                    height: "100%",
                    channel: canal,
                    parent: [parent, "localhost", "127.0.0.1"],
                    autoplay: true,
                    muted: true
                });
            } catch (e) {
                console.error("Error al iniciar el reproductor de Twitch:", e);
            }

            const chat = document.getElementById("twitchChat");
            chat.src = "https://www.twitch.tv/embed/" + encodeURIComponent(canal) + "/chat?parent=" + encodeURIComponent(parent);
        }

        function obtenerYoutubeId(url) {
            try {
                const direccion = new URL(url);
                const hostname = direccion.hostname.toLowerCase();
                if (hostname.includes("youtube.com")) {
                    const id = direccion.searchParams.get("v");
                    if (id) return id;
                }
                if (hostname === "youtu.be") {
                    return direccion.pathname.replace(/^\/+/, "").split("/")[0];
                }
                if (direccion.pathname.startsWith("/live/") || direccion.pathname.startsWith("/shorts/")) {
                    return direccion.pathname.split("/")[2];
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        function cargarSegundoVideo() {
            const input = document.getElementById("videoUrl");
            const url = input.value.trim();
            const pantalla = document.getElementById("secondScreen");
            const error = document.getElementById("videoError");

            if (!url) return;

            pantalla.innerHTML = "";
            error.style.display = "none";

            const youtubeId = obtenerYoutubeId(url);
            if (youtubeId) {
                const iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(youtubeId) + "?autoplay=1";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;
                iframe.title = "Vídeo de YouTube";
                pantalla.appendChild(iframe);
                return;
            }

            const urlSinQuery = url.split("?")[0].toLowerCase();
            const esVideoDirecto = urlSinQuery.endsWith(".mp4") || urlSinQuery.endsWith(".webm") || urlSinQuery.endsWith(".ogg") || urlSinQuery.endsWith(".mov");

            if (esVideoDirecto) {
                const video = document.createElement("video");
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                video.preload = "metadata";
                pantalla.appendChild(video);
                return;
            }

            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            iframe.title = "Segundo vídeo";
            pantalla.appendChild(iframe);
        }

        document.getElementById("twitchUrl").addEventListener("keydown", function(event) {
            if (event.key === "Enter") cargarTwitch();
        });

        document.getElementById("videoUrl").addEventListener("keydown", function(event) {
            if (event.key === "Enter") cargarSegundoVideo();
        });
    </script>

</body>

</html>
