<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Transmisión</title>
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0e0e10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        /* =========================================
            BARRA SUPERIOR
        ========================================== */

        .topbar {
            width: 100%;
            background: #18181b;
            padding: 12px 18px;
            border-bottom: 1px solid #303033;
        }

        .search {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        .search input {
            flex: 1;
            height: 42px;
            padding: 0 14px;
            border: 1px solid #3a3a3d;
            border-radius: 6px;
            outline: none;
            background: #1f1f23;
            color: white;
            font-size: 15px;
        }

        .search input:focus {
            border-color: #9147ff;
        }

        .search input::placeholder {
            color: #aaa;
        }

        .search button {
            height: 42px;
            padding: 0 22px;
            border: none;
            border-radius: 6px;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .search button:hover {
            background: #772ce8;
        }

        .btn-espejo {
            height: 42px;
            padding: 0 18px;
            border: none;
            border-radius: 6px;
            background: #00e676;
            color: black;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-espejo:hover {
            background: #00c853;
        }

        /* =========================================
            CONTENEDOR
        ========================================== */

        .layout {
            width: 100%;
            max-width: 1500px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* =========================================
            VIDEO + CHAT
        ========================================== */

        .stream-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 0;
            align-items: stretch;
        }

        /* =========================================
            VIDEO
        ========================================== */

        .video-area {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        #secondScreen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
        }

        #secondScreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #secondScreen video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }

        /* =========================================
            TWITCH
        ========================================== */

        #twitchWindow {
            position: absolute;
            width: 320px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 2px solid #18181b;
            border-radius: 6px;
            overflow: hidden;
            z-index: 50;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
        }

        #twitchPlayer {
            width: 100%;
            height: 100%;
        }

        /* =========================================
            POSICIONES
        ========================================== */

        .top-left {
            top: 15px;
            left: 15px;
            right: auto;
            bottom: auto;
        }

        .top-right {
            top: 15px;
            right: 15px;
            left: auto;
            bottom: auto;
        }

        .bottom-left {
            bottom: 15px;
            left: 15px;
            right: auto;
            top: auto;
        }

        .bottom-right {
            bottom: 15px;
            right: 15px;
            left: auto;
            top: auto;
        }

        /* =========================================
            CONTROLES
        ========================================== */

        .position-controls {
            position: absolute;
            z-index: 100;
            left: 50%;
            bottom: 15px;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            padding: 6px;
            background: rgba(24, 24, 27, 0.92);
            border-radius: 7px;
        }

        .position-controls button {
            width: 34px;
            height: 30px;
            border: none;
            border-radius: 5px;
            background: #2a2a2e;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .position-controls button:hover {
            background: #9147ff;
        }

        /* =========================================
            CHAT
        ========================================== */

        .chat-area {
            width: 100%;
            aspect-ratio: 340 / 506;
            background: #18181b;
            border-left: 1px solid #303033;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            height: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #303033;
            background: #18181b;
        }

        .chat-frame {
            flex: 1;
            min-height: 0;
        }

        .chat-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* =========================================
            VIDEO INPUT
        ========================================== */

        .video-input {
            width: 100%;
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .video-input input {
            flex: 1;
            height: 42px;
            padding: 0 14px;
            border: 1px solid #3a3a3d;
            border-radius: 6px;
            outline: none;
            background: #1f1f23;
            color: white;
            font-size: 15px;
        }

        .video-input input:focus {
            border-color: #9147ff;
        }

        .video-input button {
            height: 42px;
            padding: 0 22px;
            border: none;
            border-radius: 6px;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .video-input button:hover {
            background: #772ce8;
        }

        /* =========================================
            ERROR
        ========================================== */

        .error {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            background: #2a1717;
            color: #ffaaaa;
            font-size: 14px;
        }

        /* =========================================
            TABLET
        ========================================== */

        @media (max-width: 1000px) {
            .stream-layout {
                grid-template-columns: 1fr;
            }

            .chat-area {
                aspect-ratio: auto;
                height: 420px;
                border-left: none;
                border-top: 1px solid #303033;
            }

            #twitchWindow {
                width: 280px;
            }
        }

        /* =========================================
            CELULAR
        ========================================== */

        @media (max-width: 600px) {
            .topbar {
                padding: 10px;
            }

            .search {
                flex-direction: column;
            }

            .search button,
            .btn-espejo {
                width: 100%;
            }

            .layout {
                padding: 0 8px;
                margin-top: 12px;
            }

            #twitchWindow {
                width: 180px;
            }

            .position-controls {
                bottom: 5px;
            }

            .position-controls button {
                width: 30px;
                height: 28px;
            }

            .video-input {
                flex-direction: column;
            }

            .video-input button {
                width: 100%;
            }

            .chat-area {
                height: 360px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         TWITCH Y BOTÓN ESPEJO
    ========================================== -->

    <header class="topbar">
        <div class="search">
            <input
                id="twitchUrl"
                type="text"
                placeholder="Pega aquí el link de Twitch..."
                autocomplete="off"
            >
            <button onclick="cargarTwitch()">
                CARGAR TWITCH
            </button>
            <button class="btn-espejo" onclick="abrirEspejo()">
                🔗 Abrir Espejo
            </button>
        </div>
    </header>

    <!-- =========================================
         CONTENIDO
    ========================================== -->

    <main class="layout">
        <div class="stream-layout">

            <!-- VIDEO PRINCIPAL -->
            <div class="video-area">
                <div id="secondScreen">
                    <div class="empty-message">
                        Pega abajo el link del vídeo principal
                    </div>
                </div>

                <!-- TWITCH -->
                <div
                    id="twitchWindow"
                    class="bottom-left"
                >
                    <div id="twitchPlayer"></div>
                </div>

                <!-- CONTROLES DE POSICIÓN -->
                <div class="position-controls">
                    <button
                        onclick="moverTwitch('top-left')"
                        title="Arriba izquierda"
                    >
                        ↖
                    </button>
                    <button
                        onclick="moverTwitch('top-right')"
                        title="Arriba derecha"
                    >
                        ↗
                    </button>
                    <button
                        onclick="moverTwitch('bottom-left')"
                        title="Abajo izquierda"
                    >
                        ↙
                    </button>
                    <button
                        onclick="moverTwitch('bottom-right')"
                        title="Abajo derecha"
                    >
                        ↘
                    </button>
                </div>
            </div>

            <!-- CHAT -->
            <aside class="chat-area">
                <div class="chat-header">
                    Chat del stream
                </div>
                <div class="chat-frame">
                    <iframe
                        id="twitchChat"
                        title="Chat de Twitch"
                    ></iframe>
                </div>
            </aside>

        </div>

        <!-- VIDEO -->
        <div class="video-input">
            <input
                id="videoUrl"
                type="text"
                placeholder="Pega aquí el link del segundo vídeo..."
                autocomplete="off"
            >
            <button onclick="cargarSegundoVideo()">
                CARGAR VIDEO
            </button>
        </div>

        <div
            id="videoError"
            class="error"
        ></div>
    </main>

    <script>
        let twitchPlayer = null;

        /* =========================================
            ABRIR PÁGINA ESPEJO AUTOMÁTICA
        ========================================== */

        function abrirEspejo() {
            const twitchUrl = document.getElementById("twitchUrl").value.trim();
            const videoUrl = document.getElementById("videoUrl").value.trim();

            const urlEspejo = `espejo.html?twitch=${encodeURIComponent(twitchUrl)}&video=${encodeURIComponent(videoUrl)}`;
            window.open(urlEspejo, "_blank");
        }

        /* =========================================
            OBTENER CANAL DE TWITCH
        ========================================== */

        function obtenerCanal(url) {
            url = url.trim();

            if (!url) {
                return null;
            }

            if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
            ) {
                url = "https://" + url;
            }

            try {
                const direccion = new URL(url);

                if (
                    !direccion.hostname
                        .toLowerCase()
                        .includes("twitch.tv")
                ) {
                    return null;
                }

                const partes =
                    direccion.pathname
                        .replace(/^\/+/, "")
                        .replace(/\/+$/, "")
                        .split("/");

                if (!partes[0]) {
                    return null;
                }

                return partes[0];

            } catch (error) {
                return null;
            }
        }

        /* =========================================
            CARGAR TWITCH LOCAL
        ========================================== */

        function cargarTwitch() {
            const input = document.getElementById("twitchUrl");
            const valorInput = input.value.trim();
            const canal = obtenerCanal(valorInput);

            if (!canal) {
                alert("Introduce un link válido de Twitch.");
                return;
            }

            const parent = window.location.hostname || "localhost";
            const playerContainer = document.getElementById("twitchPlayer");
            playerContainer.innerHTML = "";

            try {
                twitchPlayer = new Twitch.Player("twitchPlayer", {
                    width: "100%",
                    height: "100%",
                    channel: canal,
                    parent: [parent, "localhost", "127.0.0.1"],
                    autoplay: true,
                    muted: false
                });
            } catch (e) {
                console.error("Error al iniciar el reproductor de Twitch:", e);
            }

            /* CHAT */
            const chat = document.getElementById("twitchChat");
            chat.src =
                "https://www.twitch.tv/embed/" +
                encodeURIComponent(canal) +
                "/chat?parent=" +
                encodeURIComponent(parent);
        }

        /* =========================================
            MOVER TWITCH LOCAL
        ========================================== */

        function moverTwitch(posicion) {
            const ventana = document.getElementById("twitchWindow");

            ventana.classList.remove(
                "top-left",
                "top-right",
                "bottom-left",
                "bottom-right"
            );

            ventana.classList.add(posicion);
        }

        /* =========================================
            OBTENER ID DE YOUTUBE
        ========================================== */

        function obtenerYoutubeId(url) {
            try {
                const direccion = new URL(url);
                const hostname = direccion.hostname.toLowerCase();

                if (hostname.includes("youtube.com")) {
                    const id = direccion.searchParams.get("v");
                    if (id) {
                        return id;
                    }
                }

                if (hostname === "youtu.be") {
                    return direccion.pathname.replace(/^\/+/, "").split("/")[0];
                }

                if (direccion.pathname.startsWith("/live/")) {
                    return direccion.pathname.split("/")[2];
                }

                if (direccion.pathname.startsWith("/shorts/")) {
                    return direccion.pathname.split("/")[2];
                }

                return null;
            } catch (error) {
                return null;
            }
        }

        /* =========================================
            MOSTRAR ERROR
        ========================================== */

        function mostrarError(texto) {
            const error = document.getElementById("videoError");
            error.textContent = texto;
            error.style.display = "block";
        }

        /* =========================================
            CARGAR VIDEO LOCAL
        ========================================== */

        function cargarSegundoVideo() {
            const input = document.getElementById("videoUrl");
            const url = input.value.trim();
            const pantalla = document.getElementById("secondScreen");
            const error = document.getElementById("videoError");

            if (!url) {
                return;
            }

            pantalla.innerHTML = "";
            error.style.display = "none";

            /* YOUTUBE */
            const youtubeId = obtenerYoutubeId(url);

            if (youtubeId) {
                const iframe = document.createElement("iframe");
                iframe.src =
                    "https://www.youtube.com/embed/" +
                    encodeURIComponent(youtubeId) +
                    "?autoplay=1";

                iframe.allow =
                    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;
                iframe.title = "Vídeo de YouTube";

                pantalla.appendChild(iframe);
                return;
            }

            /* VIDEO DIRECTO */
            const urlSinQuery = url.split("?")[0].toLowerCase();
            const esVideoDirecto =
                urlSinQuery.endsWith(".mp4") ||
                urlSinQuery.endsWith(".webm") ||
                urlSinQuery.endsWith(".ogg") ||
                urlSinQuery.endsWith(".mov");

            if (esVideoDirecto) {
                const video = document.createElement("video");
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                video.preload = "metadata";

                pantalla.appendChild(video);
                return;
            }

            /* IFRAME GENERAL */
            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            iframe.title = "Segundo vídeo";

            pantalla.appendChild(iframe);
        }

        /* =========================================
            EVENTOS ENTER
        ========================================== */

        document.getElementById("twitchUrl").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                cargarTwitch();
            }
        });

        document.getElementById("videoUrl").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                cargarSegundoVideo();
            }
        });
    </script>

</body>

</html>
